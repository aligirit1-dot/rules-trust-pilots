<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decision-making in unfamiliar situations</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">
  <style>
    .jspsych-content { max-width: 780px; font-size: 17px; line-height: 1.65; }
    .vignette-box {
      background: #f8f9fa; border-left: 4px solid #2563eb; padding: 22px 26px;
      margin: 18px 0; border-radius: 6px; font-size: 16.5px; line-height: 1.7;
      text-align: left;
    }
    .condition-box {
      background: #fffbeb; border-left: 4px solid #d97706; padding: 18px 24px;
      margin: 14px 0; border-radius: 6px; font-size: 16px; line-height: 1.65;
      text-align: left;
    }
    .safeguard-box {
      background: #f8f9fa; border-left: 4px solid #6b7280; padding: 18px 24px;
      margin: 14px 0; border-radius: 6px; font-size: 16px; line-height: 1.65;
      text-align: left;
    }
    .decision-prompt {
      font-weight: 600; font-size: 17px; margin: 20px 0 10px;
      text-align: center; color: #1e293b;
    }
    h2 { color: #1e293b; margin-bottom: 14px; }
    .consent-box {
      text-align: left; background: #fff; border: 1px solid #e2e8f0;
      padding: 28px 32px; border-radius: 8px; max-width: 700px;
      margin: 0 auto; font-size: 15px; line-height: 1.7;
    }
    .consent-box h3 { margin-top: 18px; color: #334155; }
    .debrief-box {
      text-align: left; background: #f0fdf4; border: 1px solid #86efac;
      padding: 28px 32px; border-radius: 8px; max-width: 700px;
      margin: 0 auto; font-size: 15px; line-height: 1.7;
    }
    .jspsych-btn {
      background: #2563eb; color: #fff; border: none; padding: 12px 32px;
      border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;
      transition: background 0.15s; margin: 4px 8px;
    }
    .jspsych-btn:hover { background: #1d4ed8; }
    .scale-label { font-size: 14px; color: #64748b; }
    .jspsych-survey-likert-statement { font-size: 16px !important; margin-bottom: 6px !important; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 13px; color: #64748b; margin-top: 4px; }
    .jspsych-html-slider-response-container { margin: 20px auto; }
    #jspsych-html-slider-response-response { width: 100%; }
  </style>
</head>
<body></body>
<script>
// ================================================================
// STUDY 1: HIGH-STAKES VIGNETTES
// 3 Domains × 3 Conditions (No-Rule, Rule, Rule+Enforcement) = 9 cells
// N per power analysis (see Study 1 design deck). Childcare domain
// dropped 2026-05-19 after RA pre-pilot (see vignettes block below).
// ================================================================

const urlParams = new URLSearchParams(window.location.search);
const PROLIFIC_PID = urlParams.get('PROLIFIC_PID') || 'PREVIEW';
const STUDY_ID = urlParams.get('STUDY_ID') || 'PREVIEW';
const SESSION_ID = urlParams.get('SESSION_ID') || 'PREVIEW';
const PROLIFIC_COMPLETION_URL = 'https://app.prolific.com/submissions/complete?cc=CAOLXQVO';

// DataPipe (pipe.jspsych.org) -> OSF data deposit. Experiment ID set at
// DataPipe registration; the save trial runs right before the end screen.
const DATAPIPE_EXPERIMENT_ID = 'ncPULBp2sUUS';
const DATA_FILENAME = 'study1_' + PROLIFIC_PID + '_' +
  Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '.csv';

const jsPsych = initJsPsych({
  show_progress_bar: true,
  auto_update_progress_bar: true,
  on_finish: function() {
    if (PROLIFIC_PID !== 'PREVIEW') {
      window.location.href = PROLIFIC_COMPLETION_URL;
    }
  }
});

// --- Randomisation ---
// childcare removed 2026-05-19 (see rationale at the vignettes block below)
const domains = ['medical', 'financial', 'safety'];
const conditions = ['norule', 'rule', 'rule_enforcement'];
const assignedDomain = jsPsych.randomization.sampleWithoutReplacement(domains, 1)[0];
const assignedCondition = jsPsych.randomization.sampleWithoutReplacement(conditions, 1)[0];

const actorLabels = {
  medical: 'the medical staff',
  financial: 'the exchange clerk',
  safety: 'the taxi driver'
};
const actor = actorLabels[assignedDomain];

// ================================================================
// VIGNETTE TEXT
// Design principles (per Kupfer feedback, March–April 2026):
//   1. Core + threat: foreign setting, unknown actor, no person-specific info, risk from uncertainty
//   2. Safeguard block: describes available protective resource (norule), + rule (rule), + enforcement (rule_enforcement)
//   3. Risk framing: uncertainty-based, NOT location-specific ("in this area have been known to..." removed)
//   4. Rule condition: Gächter-style rule mandating use of the safeguard
//   5. Rule+Enforcement condition: rule + domain-appropriate sanction
//   6. Information matched across conditions — rule (+ enforcement) is the ONLY difference
//   7. No third-party trust cues
//   8. Structural separation: Block 1 (blue) = core + threat; Block 2 (grey/amber) = safeguard (+ rule) (+ enforcement)
// ================================================================
const vignettes = {
  medical: {
    core_threat: `Imagine you have fallen seriously ill while travelling alone in a country you are visiting for the first time. You do not speak the local language. You have been taken to the nearest hospital, a small unfamiliar facility, where a doctor has determined you need a surgical procedure that would be difficult to safely defer until you return home. The procedure will be carried out by medical staff you have never met. You have no information about them, no way to look up the hospital's record, and no one to consult for advice. The procedure will involve a general anaesthetic and an abdominal incision. You will be fully unconscious throughout.\n\nPost-operative infection is a known risk with this type of procedure. One common cause is the use of surgical instruments that have not been properly sterilised before use.`,
    norule: `You must now decide whether to proceed with the surgery at this hospital.`,
    rule: `There is a rule that staff must check that each surgical instrument has been sterilised before use and reject any instrument that has not. The staff have been informed of this rule.\n\nYou must now decide whether to proceed with the surgery at this hospital.`,
    rule_enforcement: `There is a rule that staff must check that each surgical instrument has been sterilised before use and reject any instrument that has not. The staff have been informed of this rule. Each instrument's sterilisation check is logged, and the use of any instrument not confirmed as sterilised is automatically flagged, resulting in disciplinary action against the responsible staff member.\n\nYou must now decide whether to proceed with the surgery at this hospital.`
  },
  financial: {
    core_threat: `Imagine you are travelling alone in a country you are visiting for the first time. You need to exchange a large sum of cash, all you have left for the trip, into local currency. The banks are closed, and the only one open nearby is a small independent currency exchange bureau on a side street. One clerk is on duty. You have no way to verify the business's reputation, no way to look up reviews, and no one to ask for a recommendation.\n\nUnfamiliar exchange bureaux are a common place for travellers to be short-changed, through unfavourable rates, hidden fees, or miscounted cash.`,
    norule: `The national exchange rate is published daily by the central bank and displayed on a public board outside the bureau, visible to passers-by.\n\nYou must now decide whether to exchange your money at this bureau.`,
    rule: `The national exchange rate is published daily by the central bank and displayed on a public board outside the bureau, visible to passers-by.\n\nThere is a rule that the clerk must apply the rate shown on the public board before handing over the cash. The clerk has been informed of this rule.\n\nYou must now decide whether to exchange your money at this bureau.`,
    rule_enforcement: `The national exchange rate is published daily by the central bank and displayed on a public board outside the bureau, visible to passers-by.\n\nThere is a rule that the clerk must apply the rate shown on the public board before handing over the cash. The clerk has been informed of this rule. Any discrepancy between the posted rate and the rate applied is automatically logged and flagged, resulting in disciplinary action against the clerk.\n\nYou must now decide whether to exchange your money at this bureau.`
  },
  safety: {
    core_threat: `Imagine you are travelling alone in a country you are visiting for the first time. You have just arrived at the airport and need to get to your hotel, which is approximately 25 minutes away by car. The roads are unfamiliar to you. You start to get into one of the taxis outside the airport. The driver is a stranger; you have no way of checking their record or reputation.\n\nPart of the route runs along fast open roads, where exceeding the speed limit is a major cause of serious accidents. How safely you arrive depends largely on whether the driver keeps to the limit, and once the journey is under way you have little ability to influence this.`,
    norule: `You must now decide whether to take this taxi.`,
    rule: `There is a rule that the driver must not exceed the speed limit. The driver has been informed of this rule.\n\nYou must now decide whether to take this taxi.`,
    rule_enforcement: `There is a rule that the driver must not exceed the speed limit. The driver has been informed of this rule. The vehicle's speed is automatically logged, and any time the driver exceeds the limit this is flagged and reported to the taxi company, resulting in disciplinary action against the driver.\n\nYou must now decide whether to take this taxi.`
  },
  // childcare scenario removed 2026-05-19 following RA pre-pilot feedback that
  // confirmed the silicon floor effect (proceed 14-24% across NR/R/R+E) is
  // structural rather than wording-driven; majority of RAs would refuse
  // regardless of rule or enforcement. Dan Fessler concurred (12 May 2026
  // email reply) that there is no simple way to eliminate the floor while
  // preserving realism. The stale block is preserved in
  // study1_vignettes.backup-before-ra-feedback-edits-2026-05-19.html.
};

// ================================================================
// TIMELINE
// ================================================================
const timeline = [];

// --- Record assignment ---
timeline.push({
  type: jsPsychCallFunction,
  func: function() {
    jsPsych.data.addProperties({
      prolific_pid: PROLIFIC_PID,
      study_id: STUDY_ID,
      session_id: SESSION_ID,
      assigned_domain: assignedDomain,
      assigned_condition: assignedCondition,
      study: 'study1_vignettes'
    });
  }
});

// --- 1. INFORMATION SHEET & CONSENT ---
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div class="consent-box">
      <h2 style="text-align:center;">Participant Information</h2>
      <p style="text-align:center; font-style:italic; color:#475569; margin-bottom:12px;">Study title: <strong>Decision-making in unfamiliar situations</strong></p>
      <p><strong>Ethics ID:</strong> IRB-25-0482 (UCLA)</p>

      <h3>What is this study about?</h3>
      <p>This study looks at how personality traits relate to the decisions people make in unfamiliar situations.</p>

      <h3>What will I do?</h3>
      <p>You will complete one online session (approximately 5–10 minutes) involving a hypothetical scenario, brief questionnaires about your thoughts and feelings, and personality trait questions.</p>

      <h3>Do I have to take part?</h3>
      <p>Participation is voluntary. You can withdraw at any time by closing your browser. You have two weeks after completion to withdraw your data by contacting the researcher via Prolific using your Prolific ID.</p>

      <h3>Who is running this?</h3>
      <p><strong>Principal Investigator:</strong> Professor Daniel Fessler, UCLA Department of Anthropology (dfessler@anthro.ucla.edu)<br>
      <strong>Lead Researcher:</strong> Ali Giritlioğlu (ali.giritlioglu@ntu.ac.uk)<br>
      <strong>Co-Investigator:</strong> Dr Tom Kupfer, NTU (tom.kupfer@ntu.ac.uk)<br>
      <strong>Funding:</strong> U.S. Air Force Office of Scientific Research (AFOSR)</p>

      <h3>Confidentiality</h3>
      <p>Data stored securely. Your identity is anonymous. Prolific ID deleted after the two-week withdrawal window. Anonymised data shared on OSF under CC BY-NC-SA licence.</p>

      <h3>Compensation</h3>
      <p>£2.50 for approximately 10 minutes (if you do not fail more than one attention check).</p>

      <h3>Data Protection</h3>
      <p>Complies with UK GDPR and Data Protection Act 2018.</p>
    </div>
  `,
  choices: ['Continue to consent form']
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div class="consent-box">
      <h2 style="text-align:center;">Consent Form</h2>
      <p>Version 4, dated 27.03.2026</p>
      <p>By clicking "I consent" below, you confirm that:</p>
      <ul style="text-align:left;">
        <li>You have read and understood the information sheet and have had the opportunity to ask questions.</li>
        <li>You understand participation is voluntary and you can withdraw your data up to two weeks after participation.</li>
        <li>You understand anonymous data will be publicly shared under a Creative Commons BY-NC-SA licence.</li>
        <li>You understand outputs may be published, presented, or shared with collaborators and funders.</li>
        <li>You understand this research is supported by the U.S. Department of Defense (AFOSR).</li>
      </ul>
    </div>
  `,
  choices: ['I consent to participate', 'I do not consent'],
  on_finish: function(data) {
    if (data.response === 1) {
      jsPsych.endExperiment('<p style="text-align:center;font-size:18px;">You have chosen not to consent. Thank you for your time.<br>You may close this window.</p>');
    }
  }
});

// --- 2. VIGNETTE ---
const vignetteData = vignettes[assignedDomain];
const conditionText = vignetteData[assignedCondition];

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <h2 style="text-align:center;">Please read the following scenario carefully</h2>
    <div class="vignette-box">${vignetteData.core_threat.replace(/\n/g, '<br>')}</div>
    <div class="${assignedCondition === 'norule' ? 'safeguard-box' : 'condition-box'}">${conditionText.replace(/\n/g, '<br>')}</div>
  `,
  choices: ['Continue'],
  post_trial_gap: 300
});

// --- 3. DEPENDENT VARIABLES ---

// DV1: Willingness to Proceed (7-point)
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<h2 style="text-align:center;">Your Decision</h2>',
  questions: [{
    prompt: 'How willing would you be to proceed in this situation?',
    labels: ['1<br><span class="scale-label">Not at all willing</span>',
             '2', '3',
             '4<br><span class="scale-label">Moderately willing</span>',
             '5', '6',
             '7<br><span class="scale-label">Completely willing</span>'],
    required: true, name: 'willingness_to_proceed'
  }],
  data: { dv: 'willingness' }
});

// DV2: Trust in Actor (7-point)
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<h2 style="text-align:center;">Trust</h2>',
  questions: [{
    prompt: `How much would you trust ${actor} in this situation?`,
    labels: ['1<br><span class="scale-label">Not at all</span>',
             '2', '3', '4', '5', '6',
             '7<br><span class="scale-label">Completely</span>'],
    required: true, name: 'trust_in_actor'
  }],
  data: { dv: 'trust' }
});

// DV3: Expected Appropriate Behaviour (0–100% slider)
timeline.push({
  type: jsPsychHtmlSliderResponse,
  stimulus: `
    <h2 style="text-align:center;">Expectations</h2>
    <p style="text-align:center;font-size:16px;">How likely is it that ${actor} will behave appropriately in this situation?</p>
    <div class="slider-labels"><span>0% — Not at all likely</span><span>100% — Completely likely</span></div>
  `,
  labels: ['0%', '50%', '100%'],
  min: 0, max: 100, slider_start: 50, step: 1,
  require_movement: true,
  button_label: 'Continue',
  data: { dv: 'expected_behaviour' }
});

// DV4: Perceived Predictability (mediator — rules → predictability → trust)
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<h2 style="text-align:center;">Predictability</h2>',
  questions: [{
    prompt: `How predictable do you think ${actor}'s behaviour will be in this situation?`,
    labels: ['1<br><span class="scale-label">Not at all predictable</span>',
             '2', '3', '4', '5', '6',
             '7<br><span class="scale-label">Completely predictable</span>'],
    required: true, name: 'perceived_predictability'
  }],
  data: { dv: 'predictability' }
});

// DV5: Perceived Constraint (7-point, reverse-coded)
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<h2 style="text-align:center;">Perceived Freedom</h2>',
  questions: [{
    prompt: `To what extent does ${actor} have freedom to act however they want in their role?`,
    labels: ['1<br><span class="scale-label">Complete freedom</span>',
             '2',
             '3<br><span class="scale-label">Moderate freedom</span>',
             '4', '5', '6',
             '7<br><span class="scale-label">No freedom at all</span>'],
    required: true, name: 'perceived_constraint'
  }],
  data: { dv: 'constraint' }
});

// --- 4. VULNERABILITY MANIPULATION CHECK ---
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<h2 style="text-align:center;">About the Scenario</h2>',
  questions: [
    {
      prompt: 'How vulnerable did you feel in this situation?',
      labels: ['1<br><span class="scale-label">Not at all vulnerable</span>',
               '2', '3', '4', '5', '6',
               '7<br><span class="scale-label">Extremely vulnerable</span>'],
      required: true, name: 'felt_vulnerability'
    },
    {
      prompt: 'How risky did this situation feel to you?',
      labels: ['1<br><span class="scale-label">Not at all risky</span>',
               '2', '3', '4', '5', '6',
               '7<br><span class="scale-label">Extremely risky</span>'],
      required: true, name: 'felt_risk'
    }
  ],
  data: { measure: 'vulnerability_check' }
});

// --- 5. MANIPULATION CHECK ---
timeline.push({
  type: jsPsychSurveyMultiChoice,
  preamble: '<h2 style="text-align:center;">Comprehension Check</h2>',
  questions: [{
    prompt: `In the scenario you read, were there any rules or requirements that ${actor} was obligated to follow?`,
    options: [
      'Yes — and there were consequences for not following them',
      'Yes — but no consequences were mentioned',
      'No — no rules or requirements were mentioned'
    ],
    required: true, name: 'rule_manipulation_check'
  }],
  data: { measure: 'comprehension' }
});

// --- 6. COVARIATES ---

// Trust Propensity (Gefen 2000, 6 items, 7-point)
const trustPropensityLabels = [
  '1<br><span class="scale-label">Strongly disagree</span>',
  '2', '3', '4', '5', '6',
  '7<br><span class="scale-label">Strongly agree</span>'
];

timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<h2 style="text-align:center;">About You</h2><p>Please indicate how much you agree or disagree with each statement.</p>',
  questions: [
    { prompt: 'I generally trust other people.', labels: trustPropensityLabels, required: true, name: 'trust_prop_1' },
    { prompt: 'I generally have faith in humanity.', labels: trustPropensityLabels, required: true, name: 'trust_prop_2' },
    { prompt: 'I feel that people are generally reliable.', labels: trustPropensityLabels, required: true, name: 'trust_prop_3' },
    { prompt: 'I generally trust other people unless they give me reason not to.', labels: trustPropensityLabels, required: true, name: 'trust_prop_4' },
    { prompt: 'Most people are basically honest.', labels: trustPropensityLabels, required: true, name: 'trust_prop_5' },
    { prompt: 'Most people are trustworthy.', labels: trustPropensityLabels, required: true, name: 'trust_prop_6' }
  ],
  data: { measure: 'trust_propensity' }
});

// Risk Propensity (Zhang et al. 2019, 8 items, 5-point) + Attention check
// All 5 labels shown so attention check instruction is clear
const riskPropensityLabels = [
  '1<br><span class="scale-label">Strongly disagree</span>',
  '2<br><span class="scale-label">Disagree</span>',
  '3<br><span class="scale-label">Neither</span>',
  '4<br><span class="scale-label">Somewhat agree</span>',
  '5<br><span class="scale-label">Strongly agree</span>'
];

timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<p>Please indicate how much you agree or disagree with each statement.</p>',
  questions: [
    { prompt: 'I am attracted, rather than scared, by risk.', labels: riskPropensityLabels, required: true, name: 'risk_prop_1' },
    { prompt: 'I often take risks when I think there is a chance I can gain something.', labels: riskPropensityLabels, required: true, name: 'risk_prop_2' },
    { prompt: 'I like to take chances.', labels: riskPropensityLabels, required: true, name: 'risk_prop_3' },
    { prompt: 'Taking risks makes life more fun.', labels: riskPropensityLabels, required: true, name: 'risk_prop_4' },
    { prompt: 'To ensure you are reading carefully, please select "Somewhat agree" for this item.', labels: riskPropensityLabels, required: true, name: 'attention_check' },
    { prompt: 'I see taking risks as a challenge.', labels: riskPropensityLabels, required: true, name: 'risk_prop_5' },
    { prompt: 'Risk-taking is exciting to me.', labels: riskPropensityLabels, required: true, name: 'risk_prop_6' },
    { prompt: 'I would rather be safe than sorry.', labels: riskPropensityLabels, required: true, name: 'risk_prop_7_R' },
    { prompt: 'I prefer to avoid risks.', labels: riskPropensityLabels, required: true, name: 'risk_prop_8_R' }
  ],
  data: { measure: 'risk_propensity' }
});

// --- 7. DEMOGRAPHICS ---
timeline.push({
  type: jsPsychSurveyText,
  preamble: '<h2 style="text-align:center;">Demographics</h2>',
  questions: [
    { prompt: 'What is your age?', required: true, name: 'age', placeholder: '18–100' }
  ],
  data: { measure: 'demographics_age' }
});

timeline.push({
  type: jsPsychSurveyMultiChoice,
  questions: [
    {
      prompt: 'What is your gender?',
      options: ['Male', 'Female', 'Non-binary', 'Prefer not to say', 'Prefer to self-describe'],
      required: true, name: 'gender'
    },
    {
      prompt: 'What is the highest level of education you have completed?',
      options: ['No formal qualifications', 'GCSE/O-Level or equivalent', 'A-Level or equivalent',
                'Bachelor\'s degree', 'Master\'s degree', 'Doctoral degree', 'Other professional qualification'],
      required: true, name: 'education'
    },
    {
      prompt: 'What is your current employment status?',
      options: ['Employed full-time', 'Employed part-time', 'Self-employed',
                'Unemployed', 'Student', 'Retired', 'Other'],
      required: true, name: 'employment'
    }
  ],
  data: { measure: 'demographics_main' }
});

// Parenthood (Study 1 specific)
timeline.push({
  type: jsPsychSurveyMultiChoice,
  questions: [{
    prompt: 'Do you have children?',
    options: ['Yes', 'No'],
    required: true, name: 'has_children'
  }],
  data: { measure: 'demographics_parenthood' }
});

timeline.push({
  timeline: [{
    type: jsPsychSurveyText,
    preamble: '<p>You indicated you have children.</p>',
    questions: [
      { prompt: 'How many children do you have?', required: true, name: 'num_children', placeholder: 'e.g. 2' },
      { prompt: 'What are their ages?', required: true, name: 'children_ages', placeholder: 'e.g. 3 and 7' }
    ],
    data: { measure: 'demographics_children_detail' }
  }],
  conditional_function: function() {
    const lastTrial = jsPsych.data.get().filter({measure: 'demographics_parenthood'}).last(1).values()[0];
    return lastTrial && lastTrial.response && lastTrial.response.has_children === 'Yes';
  }
});

// --- 8. DEBRIEF ---
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div class="debrief-box">
      <h2 style="text-align:center;">Thank you for participating!</h2>
      <p>This study explores how <strong>rules and enforcement</strong> affect people's willingness to trust unfamiliar individuals in high-stakes situations. Some participants were told that the person in the scenario was required to follow specific rules, some were also told about consequences for non-compliance, while others received no such information.</p>
      <p>Your responses will help us understand the role that institutional rules play in building trust between strangers.</p>
      <p>If you have any questions or concerns, please contact:<br>
      <strong>Ali Giritlioğlu</strong> — ali.giritlioglu@ntu.ac.uk<br>
      <strong>Dr Tom Kupfer</strong> — tom.kupfer@ntu.ac.uk</p>
    </div>
  `,
  choices: ['Continue']
});

// --- 8b. DATA DEPOSIT (DataPipe -> OSF) ---
timeline.push({
  type: jsPsychPipe,
  action: 'save',
  experiment_id: DATAPIPE_EXPERIMENT_ID,
  filename: DATA_FILENAME,
  data_string: () => jsPsych.data.get().csv()
});

// --- 9. END ---
