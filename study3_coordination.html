        cls = 'bz-outcome-pop';
      } else if (outcome === 'safe_exit') {
        msg = 'You took the safe exit.<br>You earned <strong>' + payout + ' tokens</strong>, a bonus of <strong>' + tokensToGBP(payout) + '</strong>.<br>Your total for this study: <strong>' + totalGBP(payout) + '</strong>.';
        cls = 'bz-outcome-exit';
      }
      gameEl.innerHTML = '<h2 style="text-align:center;">Result</h2>' +
        '<div class="bz-outcome-msg ' + cls + '">' + msg + '</div>' +
        '<div style="text-align:center;"><button id="bz-continue" class="bz-btn bz-btn-primary">Continue</button></div>';
      document.getElementById('bz-continue').addEventListener('click', function() {
        jsPsych.finishTrial(gameData);
      });
    }
  },
  on_finish: function(data) {
    Object.assign(data, gameData);
    data.phase = 'crossing_zone_game';
  }
});

// ---- 10. POST-GAME DVs ----
// Order (locked 2026-04-18 evening): Trust (primary) → Vulnerability + Risk
// (Mayer's willingness-to-be-vulnerable core) → Perceived control (H9 self-
// agency manipulation check) → Predictability (H6 crown-jewel dissociation
// from trust, Dunning et al. 2014) → Trustee perception (benevolence + harm
// attribution) → Perceived constraint → Bicchieri empirical → Bicchieri
// normative (rule-only) → Decision reasoning (MC + open, metacognitive;
// placed AFTER all state measures so the post-hoc narrative does not filter
// state ratings) → manipulation checks → risk propensity → driving + Mini-
// DBQ → demographics → debrief. Rationale: self-state measures come before
// partner-state measures; partner-state measures come before population-
// belief mediators; all state-sensitive DVs come before metacognition; traits
// and demographics come last. The earlier order (Trust → Control → Bicchieri
// → Constraint → Predictability → Trustee → Reasoning → Vulnerability) was
// reorganised because (a) placing vulnerability ten screens after trust left
// Mayer's theoretical core measured after heavy decay and after the
// reasoning-narrative was formed; (b) predictability needs to sit close to
// trust for the H6 severity test; (c) placing Bicchieri normative before
// perceived constraint primed the constraint rating with the "ought"
// framing.
//
// Primary DV — trust in partner. Single-item Likert. Framing follows the
// Mayer, Davis & Schoorman (1995, AMR) definition of trust as "the
// willingness of a party to be vulnerable to the actions of another party
// based on the expectation that the other will perform a particular action
// important to the trustor". The item operationalises this in task-specific
// terms by anchoring on the specific action whose occurrence determines the
// trustor's outcome (the partner being outside the crossing zone). Single-
// item trust measures of this form have been used throughout the trust-game
// literature — Simpson (2007, JPSP); Zak & Knack (2001, QJE) with WVS trust
// item; Johnson & Mislin (2011, JEBO meta-analysis of trust-game studies).
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<h2 style="text-align:center;">About Your Decision</h2><p style="text-align:center; color:#475569; font-size:15px;">Please answer whether or not you chose to cross.</p>',
  questions: [{
    prompt: 'Thinking back to the task, how much did you trust the other participant to stay out of the crossing zone while your balloon crossed (or would have crossed) it?',
    labels: ['1<br><span class="scale-label">Not at all</span>','2','3','4','5','6','7<br><span class="scale-label">Completely</span>'],
    required: true, name: 'trust_in_partner'
  }],
  data: { dv: 'trust' }
});

// Felt vulnerability + felt risk — paired on one screen, placed immediately
// after the trust DV because Mayer, Davis & Schoorman (1995, AMR) define
// trust AS "willingness to be vulnerable". Capturing vulnerability right
// after trust is the direct severity check on the Mayer operationalisation:
// if trust ratings rise across the rule gradient but felt vulnerability does
// not vary, the trust DV may be tracking something other than the Mayer
// construct. Vulnerability-perception checks of this form are used
// throughout the trust-game literature to confirm that the participant
// experienced the decision as consequential rather than as an abstract
// allocation (Ben-Ner & Halldorsson 2010 review). The felt-risk item is the
// subjective-risk counterpart in the Slovic (1987) risk-perception
// tradition — not a trust component per se, but included to let
// vulnerability and risk perception be distinguished at analysis.
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<h2 style="text-align:center;">About the Task</h2><p style="text-align:center; color:#475569; font-size:15px;">Please answer whether or not you chose to cross.</p>',
  questions: [
    {
      prompt: 'How vulnerable did you feel while considering whether and when to cross?',
      labels: ['1<br><span class="scale-label">Not at all vulnerable</span>','2','3','4','5','6','7<br><span class="scale-label">Extremely vulnerable</span>'],
      required: true, name: 'felt_vulnerability'
    },
    {
      prompt: 'How risky did crossing the zone seem to you?',
      labels: ['1<br><span class="scale-label">Not at all risky</span>','2','3','4','5','6','7<br><span class="scale-label">Extremely risky</span>'],
      required: true, name: 'felt_risk'
    }
  ],
  data: { measure: 'vulnerability_check' }
});

// Perceived self-agency / locus of outcome — manipulation check (H9) on
// whether participants experienced the rule conditions as giving them more
// control over their own fate (via a constrained partner) than the control
// condition did. Grounded in Skinner's (1996) perceived-control framework
// and Langer's (1975) illusion-of-control literature: when another agent's
// behaviour is rule-bound, one's own outcome feels more self-determined.
// Expected pattern if the manipulation works as intended: monotonic rise
// in perceived control across Control < Signal ≤ Rule < Rule+Enforcement.
// Kept in the self-state block (after vulnerability, before the partner-
// state block) so the referent stays on the participant's own experience.
timeline.push({
  type: jsPsychSurveyLikert,
  questions: [{
    prompt: 'During the task, how much did it feel like the outcome was in your own hands rather than up to the other participant?',
    // 2026-04-26: anchor labels tightened. Previous endpoints mixed referent
    // direction ("up to them" / "in my hands"); now consistent ("up to the
    // other participant" / "up to me"), and midpoint changed from a value-
    // claim ("Equally both") to a neutral descriptor ("Roughly equal").
    labels: ['1<br><span class="scale-label">Entirely up to the other participant</span>','2','3','4<br><span class="scale-label">Roughly equal</span>','5','6','7<br><span class="scale-label">Entirely up to me</span>'],
    required: true, name: 'perceived_control'
  }],
  data: { dv: 'perceived_control' }
});

// Perceived predictability of partner behaviour — single-item Likert.
// Predictability as a distinct dimension of trust originates with Rempel,
// Holmes & Zanna (1985, JPSP) — the "Trust Scale for Close Relationships"
// includes a 5-item Predictability subscale measuring consistency of a
// partner's behaviour based on past experience. Adapted here to a one-shot
// interaction context where no history exists; the item captures the
// participant's inferred behavioural consistency of the partner from the
// trial alone. Predictability is theoretically distinct from trust itself
// (Mayer et al. 1995 argue that trust requires vulnerability over and above
// predictability, and Gambetta 1988 notes that a predictably hostile agent
// is not an object of trust). Placed close to the trust DV to support H6
// (Dunning et al. 2014 trust-prediction dissociation — the crown-jewel
// severity contrast: rule's effect on trust > rule's effect on prediction).
// Also opens the partner-state block with the "About the Other Participant"
// section header so the referent cleanly shifts from self to partner.
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<h2 style="text-align:center;">About the Other Participant</h2>',
  questions: [{
    prompt: 'How predictable did the other participant\'s behaviour feel during the task?',
    labels: ['1<br><span class="scale-label">Not at all predictable</span>','2','3','4','5','6','7<br><span class="scale-label">Completely predictable</span>'],
    required: true, name: 'perceived_predictability'
  }],
  data: { dv: 'predictability' }
});

// Trustee perception — two single-item measures tapping distinct
// trust-relevant attributions. Item 1 (consideration of impact) is the
// task-level operationalisation of Mayer, Davis & Schoorman's (1995, AMR)
// BENEVOLENCE component of trustworthiness: "the extent to which a trustee
// is believed to want to do good for the trustor". Item 2 (responsibility
// for collision) is a moral-responsibility attribution in the Shaver
// (1985) / Weiner (1995) attribution-of-blame tradition; capacity-based
// responsibility attributions are a standard DV in moral-judgement studies
// of rule-bound vs. discretionary actors (e.g., Cushman 2008; Malle et al.
// 2014 path model of blame). No preamble — reads as continuation of the
// partner-state block opened by the predictability item above.
timeline.push({
  type: jsPsychSurveyLikert,
  questions: [
    {
      prompt: 'To what extent do you think the other participant considered the impact of their actions on you?',
      labels: ['1<br><span class="scale-label">Not at all</span>','2','3','4','5','6','7<br><span class="scale-label">Very much</span>'],
      required: true, name: 'trustee_benevolence'
    },
    {
      prompt: 'If a collision occurred (or had occurred), how responsible would you consider the other participant?',
      labels: ['1<br><span class="scale-label">Not at all responsible</span>','2','3','4','5','6','7<br><span class="scale-label">Entirely responsible</span>'],
      required: true, name: 'trustee_harm_attribution'
    }
  ],
  data: { dv: 'trustee_perception' }
});

// Perceived constraint on the partner — study-specific manipulation-adjacent
// check, captured as a single Likert item. Closest construct in the
// literature is Kiyonari & Barclay's (2008, JPSP) use of "behavioural
// constraint perception" in trust/cooperation dilemmas. No validated short
// scale for this construct; single-item framing is standard in the
// experimental-economics adjacent literature where the construct is
// manipulation-check rather than primary DV. Placed BEFORE the Bicchieri
// normative slider so the "ought"-framing of that item does not prime this
// freedom rating (the earlier order had constraint after Bicchieri normative,
// which introduced precisely that contamination).
timeline.push({
  type: jsPsychSurveyLikert,
  questions: [{
    // 2026-04-26: tightened from "to what extent did the other participant
    // have freedom to act however they wanted?" — the original had an
    // ambiguous quantifier ("however they wanted" → "do anything at all" vs
    // "deviate from the rule"). Shorter, single-construct phrasing.
    prompt: 'How free was the other participant to act as they wished?',
    // 2026-05-05: scale flipped to align with the other DVs (low-to-high
    // matches the variable label, "freedom"). Variable renamed from
    // perceived_constraint to perceived_freedom; analysis code that needs
    // a constraint score should compute (8 - perceived_freedom). Pre-reg
    // deviation: flagged in the change log.
    // 27/09/2026: anchors aligned with Study 1 (1/3/5/7 labelled).
    labels: ['1<br><span class="scale-label">No freedom at all</span>','2',
             '3<br><span class="scale-label">Limited freedom</span>','4',
             '5<br><span class="scale-label">Moderate freedom</span>','6',
             '7<br><span class="scale-label">Complete freedom</span>'],
    required: true, name: 'perceived_freedom'
  }],
  data: { dv: 'freedom' }
});

// ---- Bicchieri-style expectations ----
// Bicchieri (2006, The Grammar of Society; 2016, Norms in the Wild) argues
// that norm-compliant behaviour is motivated by two conceptually independent
// beliefs: (a) EMPIRICAL expectations — beliefs about what others actually
// do; and (b) NORMATIVE expectations — beliefs about what others think one
// OUGHT to do. The standard operationalisation in one-shot economic games
// elicits both as population-level judgements (e.g., Bicchieri & Xiao 2009;
// Bicchieri & Chavez 2010): "how many of 100 participants would..."
// for empirical, and "how many believe one ought to..." for normative.
// Including both as parallel mediators here lets us distinguish whether a
// rule lifts trust by shifting predictions of behaviour (coordination story)
// or by shifting inferences about obligation (ToM-substitute story).
// Pre-registered analytic note (2026-04-18): empirical expectations are
// collected in all four conditions; normative expectations are only
// meaningful where an explicit rule exists (rule and rule_fine) and are
// gated accordingly.
// Copy fixes 2026-04-20 (Dan Fessler feedback): the previous wording anchored
// the items on the Balloon's crossing event ("avoid being in the crossing
// zone while a Balloon's balloon is crossing"), which implicitly presupposed
// Dart awareness of the Balloon and so broke the zero-awareness cover story.
// Rewritten to anchor on the Dart's own independent behaviour, with no
// reference to the Balloon. The empirical item asks about the Dart's
// position distribution; the normative item asks about the Dart's
// rule-following obligation. This matches Bicchieri's own operationalisation
// style (Bicchieri & Xiao 2009; Bicchieri & Chavez 2010), which anchors
// items on the actor's own behaviour rather than on co-occurrence with
// another agent.
//
// Reword 2026-05-26 (focus group, 2026-05-04). The previous wording —
// "how many would be OUTSIDE the crossing zone at any given moment" — was
// flagged as confusing by the lab (a postdoc could not work out how to
// answer it, and Dan judged that if she was confused most participants
// would be too). Three faults: it asked about the SAFE state (outside) when
// the decision-relevant quantity is the HAZARD (dart in the zone); "at any
// given moment" forced an abstract population snapshot; and the referent
// behaviour shifts by condition. Fix: keep the population FREQUENCY format
// (Comerford 2019, Economics Letters, shows out-of-100 frequencies yield more
// valid subjective probabilities than percent-chance, and it is also
// Bicchieri's canonical empirical-expectation format), flip to the hazard
// state, and anchor on the concrete crossing moment so the item reads as
// the collision-risk estimate Dan said it should capture. This also mirrors
// the trust DV ("would not be in the crossing zone while you were crossing"),
// so it stays a clean mediator and remains consistent with the cover story
// (it describes the Dart's own position, not any reaction to the Balloon).
timeline.push({
  type: jsPsychHtmlSliderResponse,
  stimulus: `
    <h2 style="text-align:center;">Expectations &mdash; what people do</h2>
    <p style="text-align:center;">Out of 100 Dart Run participants, how many do you think would have their dart inside the crossing zone at the moment you crossed (or would have crossed)?</p>
    <div class="slider-labels"><span>0 of 100</span><span>50 of 100</span><span>100 of 100</span></div>
  `,
  labels: ['0','50','100'], min:0, max:100, slider_start:50, step:1,
  require_movement: true, button_label: 'Continue',
  data: { dv: 'empirical_expectation' }
});

timeline.push({
  timeline: [{
    type: jsPsychHtmlSliderResponse,
    stimulus: `
      <h2 style="text-align:center;">Expectations &mdash; what people think they ought to do</h2>
      <p style="text-align:center;">Out of 100 Dart Run participants given this instruction, how many <strong>believe</strong> they ought to follow it, <em>regardless</em> of whether they actually do?</p>
      <div class="slider-labels"><span>0 of 100</span><span>50 of 100</span><span>100 of 100</span></div>
    `,
    labels: ['0','50','100'], min:0, max:100, slider_start:50, step:1,
    require_movement: true, button_label: 'Continue',
    data: { dv: 'normative_expectation' }
  }],
  conditional_function: function() {
    // Only ask in conditions where an explicit rule exists. In control and
    // signal there is no rule about which to hold a normative expectation.
    return cfg && cfg.hasRule === true;
  }
});

// Decision reasoning (MC + open-ended) — metacognitive reflection. Placed
// AFTER all state-sensitive DVs so that the post-hoc narrative the
// participant constructs here ("I crossed because X") does not filter the
// state ratings that come before it. Once a reasoning narrative is
// generated, subsequent ratings tend to align with it, so any state measure
// placed after reasoning is confounded with narrative consistency pressure.
//
// Options are condition-specific (2026-04-20, Dan Fessler feedback). The
// previous generic option "Following or being influenced by the instruction
// or signal in my version of the task" did not make sense for Control
// participants (no instruction or signal existed for them to follow) and
// was ambiguous for Signal participants (is the red zone a signal to
// follow?). Each condition now has an option that matches the manipulation
// content the participant actually saw.
timeline.push({
  type: jsPsychSurveyMultiChoice,
  preamble: '<h2 style="text-align:center;">Your Reasoning</h2>',
  questions: [{
    prompt: 'Which best describes your reasoning when deciding whether or when to cross?',
    options: (function() {
      const common = [
        'Trying to cross as early as possible to keep the balloon small',
        'Waiting until it seemed safe before crossing',
        'Thinking about what the other participant was likely to do'
      ];
      let conditionSpecific;
      if (cfg.hasFine) {
        conditionSpecific = 'Drawing on the wait instruction and penalty the other participant had been told about';
      } else if (cfg.hasRule) {
        conditionSpecific = 'Drawing on the wait instruction the other participant had been given';
      } else if (cfg.hasSignal) {
        conditionSpecific = 'Drawing inferences from the red zone visible on the other participant\'s rail';
      } else {
        conditionSpecific = null;
      }
      const tail = [
        'Taking the safe exit to avoid the risk entirely',
        'Other'
      ];
      return conditionSpecific
        ? common.concat([conditionSpecific]).concat(tail)
        : common.concat(tail);
    })(),
    required: true, name: 'decision_reasoning'
  }],
  data: { dv: 'reasoning_mc' }
});

timeline.push({
  type: jsPsychSurveyText,
  preamble: '<p style="text-align:center; color:#374151; font-size:16px;">Please describe briefly what you were thinking when making your decision.</p>',
  questions: [{
    prompt: '',
    required: true, name: 'decision_reasoning_open',
    rows: 3, columns: 60,
    placeholder: 'What were you thinking when you decided whether or when to cross?'
  }],
  data: { dv: 'reasoning_open' }
});

// ---- 11. MANIPULATION CHECKS ----
// Participant-facing header reworded 2026-04-20 (Dan Fessler feedback) from
// "Manipulation Check" to "A few final questions". The original label
// exposed technical research vocabulary to participants and risked being
// misread as "they are checking whether I felt manipulated". Internal data-
// field names retain the "mcheck_*" convention for analysis clarity.
timeline.push({
  type: jsPsychSurveyMultiChoice,
  preamble: '<h2 style="text-align:center;">A few final questions</h2>',
  questions: [{
    prompt: 'Which best describes what the other participant knew about you during the task?',
    options: [
      'They knew I was in the task and could see where I was',
      'They knew someone else was involved but could not see me',
      'They had no idea I existed — their task made no mention of me'
    ],
    required: true, name: 'mcheck_asymmetry'
  }],
  data: { measure: 'mcheck_asymmetry' }
});

timeline.push({
  type: jsPsychSurveyMultiChoice,
  questions: [{
    prompt: 'Which best describes what the other participant was told about their dart\'s rail in your version of the task?',
    options: [
      'They were told nothing specific about the rail',
      'Their rail had a red zone, but they were not told what it meant',
      'They were told to wait 10 seconds at the red zone before advancing, with no penalty for ignoring it',
      'They were told to wait 10 seconds at the red zone before advancing, and would lose 5 tokens if they advanced early'
    ],
    required: true, name: 'mcheck_rule_content'
  }],
  data: { measure: 'mcheck_rule_content' }
});

// ---- 11b. DISPOSITIONAL MODERATORS (moved post-task 2026-04-22) ----
// Trust propensity (Frazier, Johnson & Fainshmidt 2013), institutional-trust
// belief (2-item exploratory, closest validated framework: PytlikZillig et
// al. 2016 Perceived Legitimacy), and moral universalism (Enke, Rodriguez-
// Padilla & Zimmermann 2023 RESTUD short form) sit here rather than in the
// pre-task block. Rationale (Tom Kupfer's framing, agreed by Dan Fessler on
// 22 Apr): if a pre-task dispositional scale primes the experimental DV the
// whole study collapses, whereas if the DV primes the scale the main
// experimental contrast is still intact — the asymmetric risk favours
// post-task placement. A sensitivity analysis regresses post-task moderator
// scores on condition to report any residual condition-on-scale effect; the
// pre-registration will also randomly assign a subset of participants to
// pre-task placement so the two priming directions can be bounded
// empirically.

// Propensity-to-Trust — Frazier, Johnson & Fainshmidt (2013), 4 items,
// 7-point Likert.
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<h2 style="text-align:center;">About You</h2><p>Please indicate how much you agree or disagree with each statement.</p>',
  questions: [
    { prompt: 'My tendency to trust others is high.', labels: tp7, required: true, name: 'trust_prop_1' },
    { prompt: 'I generally give people the benefit of the doubt when I first meet them.', labels: tp7, required: true, name: 'trust_prop_2' },
    { prompt: 'I usually trust people until they give me a reason not to trust them.', labels: tp7, required: true, name: 'trust_prop_3' },
    { prompt: 'Trusting another person is not difficult for me.', labels: tp7, required: true, name: 'trust_prop_4' }
  ],
  data: { measure: 'trust_propensity' }
});

// Institutional-trust belief — 2-item exploratory measure, phrased so the
// word "rule" does not appear in participant-facing wording (2026-04-20
// softening per Dan Fessler). Closest validated framework: PytlikZillig et
// al. 2016 Perceived Legitimacy.
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<p>Please indicate how much you agree or disagree with each statement.</p>',
  questions: [
    { prompt: 'Formal institutions are generally effective at ensuring that people behave properly.', labels: tp7, required: true, name: 'inst_trust_1' },
    { prompt: 'When formal rules govern someone\'s actions, I feel more confident they will act appropriately.', labels: tp7, required: true, name: 'inst_trust_2' }
  ],
  data: { measure: 'institutional_trust_belief' }
});

// Moral Universalism — Enke, Rodriguez-Padilla & Zimmermann 2023 (RESTUD)
// short form. Four hypothetical £100 allocations across in-/out-group
// pairs. Higher allocation to the second (out-group) recipient = higher
// universalism.
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div id="bz-root"><div class="bz-panel" style="padding:28px 36px;">
      <h2 style="text-align:center; margin:0 0 12px;">A short allocation task</h2>
      <p style="color:#334155; font-size:15px; line-height:1.55;">On the next few screens, imagine you have been given <strong>£100</strong> that you must give away to two other people. You cannot keep any of it for yourself.</p>
      <p style="color:#334155; font-size:15px; line-height:1.55;">For each pair of recipients, please move the slider to show how you would split the £100 between them. Assume both recipients have the same standard of living and neither will learn who sent the money.</p>
      <p style="color:#374151; font-size:15px; margin-top:10px;">These decisions are <em>hypothetical</em> &mdash; no money is being sent.</p>
    </div></div>
  `,
  choices: ['Continue'],
  data: { phase: 'universalism_intro' }
});

const uniItems = [
  { left: 'A member of your immediate family', right: 'A randomly chosen person from your country',        name: 'uni_family_compatriot' },
  { left: 'A randomly chosen person from your country', right: 'A randomly chosen person from another country', name: 'uni_compatriot_foreigner' },
  { left: 'Someone who shares your religious or spiritual views', right: 'Someone whose religious or spiritual views are very different from yours', name: 'uni_religion' },
  { left: 'Someone who shares your political views',   right: 'Someone whose political views are very different from yours', name: 'uni_politics' }
];
uniItems.forEach(function(it) {
  timeline.push({
    type: jsPsychHtmlSliderResponse,
    stimulus: `
      <h3 style="text-align:center; margin:0 0 18px;">How would you split the £100?</h3>
      <div style="display:flex; justify-content:space-between; max-width:640px; margin:0 auto 10px; font-size:14px; color:#334155;">
        <span style="flex:1; text-align:left;"><strong>${it.left}</strong></span>
        <span style="flex:1; text-align:right;"><strong>${it.right}</strong></span>
      </div>
      <div class="slider-labels" style="max-width:640px; margin:0 auto;"><span>£100 / £0</span><span>£50 / £50</span><span>£0 / £100</span></div>
      <p style="text-align:center; font-size:12px; color:#64748b; margin-top:8px;">If your answer is exactly £50 / £50, please click or tap the slider once to register it.</p>
    `,
    labels: ['£100 / £0','£50 / £50','£0 / £100'],
    min: 0, max: 100, slider_start: 50, step: 1,
    // 2026-04-26: require_movement flipped to true. The previous default-
    // 50-with-no-required-interaction setup let participants click Continue
    // without engaging, producing a contaminated bimodal distribution at 50.
    // The "tap to register £50/£50" copy above handles the small-but-real
    // case of a sincere midpoint response.
    require_movement: true, button_label: 'Continue',
    data: { measure: 'universalism', item: it.name }
  });
});


// ---- 12. RISK PROPENSITY ----
// Meertens & Lion (2008) Risk Propensity Scale — 7 items, 9-point Likert
// from "totally disagree" to "totally agree". Items 1–3 and 7 are reverse
// scored (reverse-keyed in the data for analysis; left upright here to match
// the published wording).
const rps9 = [
  '1<br><span class="scale-label">Totally disagree</span>',
  '2','3','4',
  '5<br><span class="scale-label">Neutral</span>',
  '6','7','8',
  '9<br><span class="scale-label">Totally agree</span>'
];

timeline.push({
  type: jsPsychSurveyLikert,
  preamble: '<p>Please indicate how much you agree or disagree with each statement.</p>',
  questions: [
    { prompt: 'Safety first.', labels: rps9, required: true, name: 'rps_1_R' },
    { prompt: 'I do not take risks with my health.', labels: rps9, required: true, name: 'rps_2_R' },
    { prompt: 'I prefer to avoid risks.', labels: rps9, required: true, name: 'rps_3_R' },
    { prompt: 'To ensure you are reading carefully, please select "Neutral" for this item.', labels: rps9, required: true, name: 'attention_check' },
    { prompt: 'I take risks regularly.', labels: rps9, required: true, name: 'rps_4' },
    { prompt: 'I really dislike not knowing what is going to happen.', labels: rps9, required: true, name: 'rps_5_R' },
    { prompt: 'I usually view risks as a challenge.', labels: rps9, required: true, name: 'rps_6' },
    { prompt: 'I view myself as a risk taker (rather than a risk avoider).', labels: rps9, required: true, name: 'rps_7' }
  ],
  data: { measure: 'risk_propensity' }
});

// ---- 12b. DRIVING FILTER + MINI-DBQ VIOLATIONS (post-task) ----
// Moved here from pre-task on 2026-04-17 to avoid priming a driving frame
// onto the crossing-zone / wait / red-section semiotics of the live trial.
// Gates the Mini-DBQ: non-drivers contribute missing data on the traffic-
// rule-following covariate rather than inflating it with non-applicable
// responses.
timeline.push({
  type: jsPsychSurveyMultiChoice,
  preamble: '<h2 style="text-align:center;">Driving Experience</h2>',
  questions: [{
    prompt: 'Do you currently drive or have regular driving experience?',
    options: ['Yes', 'No'],
    required: true, name: 'drives'
  }],
  data: { measure: 'driving_filter' }
});

// Mini-DBQ Violations subscale — Martinussen, Lajunen, Møller & Özkan (2013,
// Accident Analysis & Prevention). The three highest-loading Violations items
// from Reason et al.'s (1990) original 50-item DBQ. Response scale: 0 (never)
// to 5 (nearly all the time). Higher scores = more rule-breaking; items are
// reverse-scored at analysis for a "rule-following" covariate.
const dbqLabels = [
  '0<br><span class="scale-label">Never</span>',
  '1<br><span class="scale-label">Hardly ever</span>',
  '2<br><span class="scale-label">Occasionally</span>',
  '3<br><span class="scale-label">Quite often</span>',
  '4<br><span class="scale-label">Frequently</span>',
  '5<br><span class="scale-label">Nearly all the time</span>'
];

timeline.push({
  timeline: [{
    type: jsPsychSurveyLikert,
    preamble: '<h2 style="text-align:center;">Driving Behaviour</h2><p>Please indicate how often you engage in each of the following behaviours when driving.</p>',
    questions: [
      { prompt: 'Driving especially close or "flashing" the car in front as a signal for that driver to go faster or get out of your way.',
        labels: dbqLabels, required: true, name: 'mdbq_v7' },
      { prompt: 'Deliberately disregarding the speed limits late at night or very early in the morning.',
        labels: dbqLabels, required: true, name: 'mdbq_v21' },
      { prompt: 'Getting involved in unofficial "races" with other car drivers.',
        labels: dbqLabels, required: true, name: 'mdbq_v47' }
    ],
    data: { measure: 'mini_dbq_violations' }
  }],
  conditional_function: function() {
    const last = jsPsych.data.get().filter({ measure: 'driving_filter' }).last(1).values()[0];
    return last && last.response && last.response.drives === 'Yes';
  }
});

// ---- 13. DEMOGRAPHICS ----
timeline.push({
  type: jsPsychSurveyText,
  preamble: '<h2 style="text-align:center;">Demographics</h2>',
  questions: [{ prompt: 'What is your age?', required: true, name: 'age', placeholder: 'Age in years' }],
  data: { measure: 'demographics_age' },
  // 27/09/2026: numeric field with the same bounds as Study 1 (13–100; the
  // under-18 floor is a data-quality check per Dan Fessler, 18 Aug 2026).
  on_load: function() {

    ageInput.type = 'number'; ageInput.min = '13'; ageInput.max = '100'; ageInput.step = '1';

});

timeline.push({

// Education, branched on country of residence — same conditional-timeline
// pattern as the children questions below. Each participant sees exactly one
// branch; the response variable is `education` in every branch, so the data
// keep a single education column. NOTE for analysis code: `education` now
// arrives in its own trial row (measure: 'demographics_education'), no longer
// inside the demographics_main row.
//
// Category sources: UK list unchanged from the previous version; US per
// Census Bureau attainment categories; Canada per Statistics Canada highest
// certificate (condensed); Australia per ABS/AQF; New Zealand per NZQF.
//
// ORDINAL MAPPING for cross-country analysis (edu_ord, ISCED-2011 bands;
// apply at analysis time, not collected at runtime):
//   1 below upper secondary . UK: No formal qualifications; GCSE/O-Level.
//     US: Less than high school. CA: No certificate/diploma/degree.
//     AU: Less than Year 12. NZ: No formal qualification.
//   2 upper secondary ....... UK: A-Level. US: High school diploma or GED.
//     CA: High school diploma. AU: Year 12. NZ: Secondary school (NCEA).
//   3 post-secondary below bachelor's ... US: Some college; Associate.
//     CA: Trades cert; College/CEGEP diploma. AU: Certificate I–IV;
//     Diploma/Advanced Diploma. NZ: Certificate/diploma below bachelor's.

//   5 master's .............. all: Master's; US/CA: Professional degree.
//   6 doctoral .............. all: Doctoral degree.
//   NA/hand-code ............ UK: Other professional qualification; all
//     'Other'-country options.
const educationOptionsByCountry = {
  'United Kingdom': ['No formal qualifications', 'GCSE/O-Level or equivalent', 'A-Level or equivalent',
                     'Bachelor\'s degree', 'Master\'s degree', 'Doctoral degree', 'Other professional qualification'],
  'United States':  ['Less than high school', 'High school diploma or GED', 'Some college, no degree',
                     'Associate degree', 'Bachelor\'s degree', 'Master\'s degree',
                     'Professional degree (e.g. MD, JD)', 'Doctoral degree'],
  'Canada':         ['No certificate, diploma or degree', 'High school diploma or equivalent',
                     'Trades certificate or apprenticeship', 'College, CEGEP or other non-university diploma',
                     'Bachelor\'s degree', 'Master\'s degree', 'Professional degree (e.g. medicine, law)',
                     'Doctoral degree'],
  'Australia':      ['Less than Year 12', 'Year 12 or equivalent', 'Certificate I–IV (including trade certificate)',
                     'Diploma or Advanced Diploma', 'Bachelor\'s degree', 'Graduate Certificate or Graduate Diploma',
                     'Master\'s degree', 'Doctoral degree'],
  'New Zealand':    ['No formal qualification', 'Secondary school qualification (e.g. NCEA)',
                     'Certificate or diploma below bachelor\'s level', 'Bachelor\'s degree',
                     'Postgraduate certificate or diploma, or Bachelor\'s with honours',

  'Other':          ['Primary education or less', 'Secondary education',
                     'Vocational or technical qualification', 'Bachelor\'s degree or equivalent',
                     'Master\'s degree or equivalent', 'Doctoral degree or equivalent']
};

Object.keys(educationOptionsByCountry).forEach(function(country) {
  timeline.push({
    timeline: [{
      type: jsPsychSurveyMultiChoice,
      questions: [{
        prompt: 'What is the highest level of education you have completed?',
        options: educationOptionsByCountry[country],
        required: true, name: 'education'
      }],
      data: { measure: 'demographics_education' }
    }],
    conditional_function: function() {
      const countryTrial = jsPsych.data.get().filter({measure: 'demographics_country'}).last(1).values()[0];
      return countryTrial && countryTrial.response && countryTrial.response.country_of_residence === country;
    }
  });
});


// ---- Cognitive Reflection Test (CRT-2) ----
// Thomson & Oppenheimer (2016). Four-item alternative to the original
// Frederick (2005) CRT, developed specifically because the original items
// had saturated in online samples (participants had seen them before).
// CRT performance is a load-bearing covariate here for two reasons:
// (a) it independently predicts deliberative-vs-intuitive response in
//     economic and trust games (Pennycook et al. 2018; Rand et al. 2014),
//     so without it we cannot separate "crossed because trusted the rule"
//     from "crossed because is a fast, heuristic responder".
// (b) it is among the strongest individual-difference predictors of
//     decision latency in sequential-sampling models (Ratcliff & McKoon
//     2008 drift-diffusion framework), making it the correct control for
//     cross-start latency as a DV (H2).
// Open-ended free-response — closed-ended CRT defeats the "intuitive
// answer arrives first" logic by listing the correct answer alongside
// the trap (Sirota & Juanchich 2018 meta-review).
// 2026-05-09: relocated from pre-task to here (post-experimental, pre-debrief)
// per Dan Fessler's recommendation, so item irritation cannot affect
// performance or compliance on the main task.
timeline.push({
  type: jsPsychSurveyText,
  preamble: '<h2 style="text-align:center;">A few quick questions</h2><p>Please answer each question as you would if someone asked you in everyday conversation. Type your answer in the box. There are no trick words — just answer what you think.</p>',
  questions: [
    { prompt: 'If you are running a race and you pass the person in second place, what place are you in?', name: 'crt2_1', required: true, rows: 1, columns: 40 },
    { prompt: 'A farmer had 15 sheep and all but 8 died. How many are left?', name: 'crt2_2', required: true, rows: 1, columns: 40 },
    { prompt: 'Emily\'s father has three daughters. The first two are named April and May. What is the third daughter\'s name?', name: 'crt2_3', required: true, rows: 1, columns: 40 },
    { prompt: 'How many cubic feet of dirt are there in a hole that is 3 feet deep, 3 feet wide, and 3 feet long?', name: 'crt2_4', required: true, rows: 1, columns: 40 }
  ],
  data: { measure: 'crt2' }
});

// ---- 14. DEBRIEF ----
timeline.push({

      <h3>Questions</h3>

// ---- 15. DATA DEPOSIT (DataPipe -> Dataverse) ----
// Runs only for live (non-focus-group) sessions where re-consent was given.
// Declined re-consent = nothing deposited, honouring "delete my data".
timeline.push({
  timeline: [{
    // Replaces plugin-pipe 0.4's save, which has no timeout and can hang for
    // good on a non-JSON server reply. Same endpoint and payload; 20 s
    // timeout, one retry; the outcome is recorded and the participant always
    // moves on to the final screen and their completion code.
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<p>Saving data. Please do not close this page.</p>',
    choices: 'NO_KEYS',
    data: { measure: 'data_save' },
    on_load: function() {
      const payload = JSON.stringify({
        experimentID: DATAPIPE_EXPERIMENT_ID,
        filename: DATA_FILENAME,
        data: jsPsych.data.get().filterCustom(function(t) { return t.measure !== 'data_save'; }).csv()
      });
      function attempt(n) {
        const ctrl = new AbortController();
        const timer = setTimeout(function() { ctrl.abort(); }, 20000);
        return fetch('https://pipe.jspsych.org/api/data/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': '*/*' },
          body: payload,
          signal: ctrl.signal
        }).then(function(r) {
          clearTimeout(timer);
          return r.text().then(function(txt) {
            if (r.ok) return { save_status: 'ok', save_http: r.status, save_attempts: n };
            throw new Error('HTTP ' + r.status + ' ' + txt.slice(0, 150));
          });
        }).catch(function(err) {
          clearTimeout(timer);
          if (n < 2) return attempt(n + 1);
          return { save_status: 'failed', save_error: String(err).slice(0, 200), save_attempts: n };
        });
      }
      attempt(1).then(function(result) { jsPsych.finishTrial(result); });
    }
  }],
  conditional_function: function() {
    if (FOCUS_GROUP) return false;
    const rc = jsPsych.data.get().filter({ measure: 'reconsent' }).last(1).values()[0];
    return !(rc && rc.response === 1);
  }
});

        <p>Contact: <strong>Ali Giritlioğlu</strong> — ali.giritlioglu@ntu.ac.uk</p>
        <p style="color:#64748b; margin-top:20px;">Click below to return to Prolific.</p>
      </div>
    `;
  },
  choices: function() {
    return FOCUS_GROUP ? ['Download my data file'] : ['Return to Prolific'];
  },
  on_finish: function() {
    if (FOCUS_GROUP) {
      // Trigger the JSON download on this terminal trial.
      try {
        const payload = {
          fg_session_id: FG_SESSION_ID,
          html_version: 'realistic',
          assigned_condition: assignedCondition,
          fg_feedback_log: window.fgFeedbackLog || [],
          jspsych_data: jsPsych.data.get().values()
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'study3_' + FG_SESSION_ID + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        // Fallback: render the JSON to the body so it can be copy-pasted.
        document.body.innerHTML = '<div style="padding:24px;"><h3>Download failed — copy the text below into a .json file and upload that:</h3><textarea style="width:100%; height:60vh;">' + JSON.stringify({ fg_session_id: FG_SESSION_ID, html_version: 'realistic', assigned_condition: assignedCondition, fg_feedback_log: window.fgFeedbackLog || [], jspsych_data: jsPsych.data.get().values() }, null, 2) + '</textarea></div>';
      }
    } else if (ON_PROLIFIC) {
      window.location.href = completionUrlForOutcome();
    }
  }
});

jsPsych.run(timeline);
