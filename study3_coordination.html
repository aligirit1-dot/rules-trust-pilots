<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Study</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">
  <style>
    .jspsych-content { max-width: 860px; font-size: 17px; line-height: 1.65; }
    .consent-box, .debrief-box {
      text-align: left; padding: 28px 32px; border-radius: 8px;
      max-width: 720px; margin: 0 auto; font-size: 15px; line-height: 1.7;
    }
    .consent-box { background: #fff; border: 1px solid #e2e8f0; }
    .consent-box h3 { margin-top: 18px; color: #334155; }
    .debrief-box { background: #f0fdf4; border: 1px solid #86efac; }
    .jspsych-btn {
      background: #2563eb; color: #fff; border: none; padding: 12px 32px;
      border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;
      margin: 4px 8px;
    }
    .jspsych-btn:hover { background: #1d4ed8; }
    .scale-label { font-size: 14px; color: #64748b; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 13px; color: #64748b; margin-top: 4px; }

    /* =========================================================
       TASK STYLES
       Scene is 680 x 340 laid out as three fixed rows:
         - label / signal strip  (y   0 –  36)
         - main zone row         (y  40 – 300)
         - bottom strip          (y 300 – 340, road fade extends through)
       All interactive items are centre-anchored with translate(-50%, -50%)
       so that balloon and dart never overflow or touch zone borders or text.
       ========================================================= */
    #bz-root { font-family: "Inter","Segoe UI",Arial,sans-serif; max-width:820px;
      margin:0 auto; padding:20px; color:#1e293b; line-height:1.55; }
    #bz-root *, #bz-root *::before, #bz-root *::after { box-sizing:border-box; }
    .bz-panel { background:#fff; border-radius:14px; padding:26px 30px;
      box-shadow:0 2px 12px rgba(0,0,0,.07); }

    .bz-header { display:flex; justify-content:space-between; align-items:center;
      padding:12px 18px; background:#f8fafc; border-radius:10px;
      margin-bottom:14px; font-size:15px; font-weight:600; gap:20px; }
    .bz-size-wrap { width:140px; height:10px; background:#e5e7eb;
      border-radius:6px; overflow:hidden; display:inline-block;
      margin-left:10px; vertical-align:middle; }
    .bz-size-bar { height:100%; background:#94a3b8; border-radius:6px;  /* 27/09/2026: neutral grey until the warning window; was red from 0 s */
      transition:width .25s linear; width:0%; }

    /* ---- Scene ---- */
    /* Extra 20 px below the crossing zone gives the dartboard room to sit
       clearly beyond the shared zone instead of tangent with its border. */
    .bz-scene { position:relative; width:680px; height:360px; margin:14px auto;
      background:#f1f5f9; border-radius:10px; overflow:hidden;
      box-shadow:0 2px 8px rgba(0,0,0,.08); }

    /* Vertical rail for the dart, full scene height, fades top and bottom.
       The solid middle band implies a rail that continues beyond the scene.
       Palette matches the POV track gradient (slate-600/700) so the Balloon
       participant sees the SAME road from above that the Dart Run
       participant sees from their seat. Updated 2026-04-18. */
    .bz-road-v { position:absolute; left:295px; top:0; width:110px; height:100%;
      background:linear-gradient(to bottom,
        rgba(71,85,105,0)   0%,
        rgba(71,85,105,.85) 18%,
        rgba(71,85,105,.85) 82%,
        rgba(71,85,105,0)   100%);
      pointer-events:none; z-index:0; }

    /* Top strip: zone names and (in signal conditions) the signal text */
    .bz-top-strip { position:absolute; top:10px; left:0; right:0; height:22px;
      display:flex; align-items:center; pointer-events:none; z-index:5; }
    .bz-strip-cell { position:absolute; font-size:11px; font-weight:600;
      text-transform:uppercase; letter-spacing:.6px; color:#64748b;
      text-align:center; }
    .bz-strip-cell.start  { left:50px;  width:180px; }
    .bz-strip-cell.cross  { left:250px; width:200px; }
    .bz-strip-cell.goal   { left:470px; width:180px; }

    /* Zones. Start and goal share a common height and vertical centre with
       the balloon. Crossing zone extends above and below to frame the road.
       The crossing zone body stays YELLOW throughout every condition — it is
       the shared space, not the signal. The signal lives on the dart's road
       strip within the zone (see .bz-road-strip below). */
    .bz-zone-start { position:absolute; left:50px;  top:120px; width:180px; height:120px;
      background:#dbeafe; border:2px solid #3b82f6; border-radius:6px; z-index:1; }
    .bz-zone-goal  { position:absolute; left:470px; top:120px; width:180px; height:120px;
      background:#dbeafe; border:2px solid #3b82f6; border-radius:6px; z-index:1; }
    .bz-zone-cross { position:absolute; left:250px; top:60px;  width:200px; height:240px;
      background:#fde68a; border:2px solid #94a3b8; border-radius:6px;
      z-index:1; }

    /* The dart's road where it passes through the crossing zone. This is
       the element that cycles red/green in signal conditions. It sits above
       the road line (which is behind) and below the balloon (which is above),
       and carries the rule text upside-down so it reads for the dart's driver
       coming down the road — not for the participant looking from above. */
    .bz-road-strip { position:absolute; left:295px; top:60px; width:110px; height:240px;
      background:#475569; z-index:1;
      transition:background .35s ease;
      display:flex; align-items:flex-start; justify-content:center; padding-top:18px; }
    .bz-road-strip.is-green { background:#22c55e; }
    .bz-road-strip.is-red   { background:#ef4444; }
    .bz-road-strip-text { transform:none; /* 27/09/2026: was rotate(180deg); the live label read upside down while the briefing thumbnail showed it upright */ font-weight:700; font-size:16px;
      letter-spacing:.5px; color:#f8fafc; text-align:center;
      white-space:nowrap; pointer-events:none; user-select:none;
      font-variant:all-small-caps; }
    .bz-road-strip.is-green .bz-road-strip-text { color:#052e16; }
    .bz-road-strip.is-red   .bz-road-strip-text { color:#fef3c7; }

    /* Dartboard at the bottom of the scene — the dart's destination, sitting
       clearly below the crossing zone with generous clearance on each side,
       in the faded portion of the road that implies distance beyond the
       visible scene. Concentric-ring dartboard. */
    .bz-dartboard { position:absolute; left:350px; top:335px;
      transform:translate(-50%, -50%); width:42px; height:42px; z-index:2;
      pointer-events:none; }

    /* Zone name labels sit BELOW the zone boxes so they never overlap balloon */
    .bz-bottom-strip { position:absolute; bottom:6px; left:0; right:0; height:20px;
      pointer-events:none; z-index:5; }
    .bz-bottom-strip .bz-strip-cell { font-size:11px; color:#475569;
      text-transform:uppercase; letter-spacing:.6px; top:0; }

    /* Hazard stripes inside the crossing zone — always on; the zone body
       itself never changes colour. */
    .bz-zone-cross::before { content:''; position:absolute; inset:0;
      background:repeating-linear-gradient(45deg, transparent, transparent 16px,
        rgba(234,179,8,.14) 16px, rgba(234,179,8,.14) 18px);
      pointer-events:none; }

    /* Balloon — centre-anchored via translate. Width/height are set
       dynamically in JS to the SVG size, so (left, top) is always the centre.
       The dart is never rendered in the participant's scene, only in demos. */
    .bz-balloon { position:absolute; z-index:4; pointer-events:none;
      transform:translate(-50%, -50%);
      transition:left 4s ease-in-out, width .2s linear, height .2s linear; }

    /* Cartoon pop — multi-phase effect built from the research brief on
       real cartoon balloon pops (CSS-Tricks, mo.js burst tutorial):
       Phase 1 (0-80 ms):  punch — scale 1 → 1.22 + brightness flash.
       Phase 2 (80-180ms): shatter — snap-collapse to scale 0.
       Plus, injected separately by popBalloon() in JS: ~10 fragment
       shards flung radially (300 ms) and ~8 radial impact lines that
       draw out then retract (220 ms). No more slow fade. */
    .bz-pop { animation: bz-pop-burst .36s cubic-bezier(.5,-.2,.7,.2) forwards; }
    @keyframes bz-pop-burst {
      0%   { transform:translate(-50%, -50%) scale(1);    opacity:1;   filter:brightness(1); }
      22%  { transform:translate(-50%, -50%) scale(1.22); opacity:1;   filter:brightness(1.6); }
      45%  { transform:translate(-50%, -50%) scale(.05);  opacity:.4;  filter:brightness(1.3); }
      100% { transform:translate(-50%, -50%) scale(0);    opacity:0;   filter:brightness(1); }
    }

    /* Fragment shard, injected radially by popBalloon(). Uses CSS custom
       properties for per-fragment trajectory (dx, dy, rot). */
    .bz-pop-frag { position:absolute; width:6px; height:10px;
      border-radius:2px; pointer-events:none; z-index:5;
      box-shadow:0 0 0 .5px rgba(0,0,0,.2);
      animation:bz-pop-frag-anim .32s cubic-bezier(.2,.6,.4,1) forwards; }
    @keyframes bz-pop-frag-anim {
      0%   { transform:translate(0,0) rotate(0deg) scale(.7); opacity:1; }
      60%  { opacity:1; }
      100% { transform:translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1);
             opacity:0; }
    }

    /* Radial impact line — the Kirby/Looney-Tunes "impact star" effect.
       Eight of these fan out from the pop centre. */
    .bz-pop-radial { position:absolute; width:2px; height:22px;
      background:#1e293b; border-radius:1px; pointer-events:none; z-index:5;
      transform-origin:center top;
      animation:bz-pop-radial-anim .22s ease-out forwards; }
    @keyframes bz-pop-radial-anim {
      0%   { transform:rotate(var(--rot)) translate(-50%, 0) scaleY(.0); opacity:1; }
      55%  { transform:rotate(var(--rot)) translate(-50%, -14px) scaleY(1); opacity:1; }
      100% { transform:rotate(var(--rot)) translate(-50%, -28px) scaleY(0); opacity:0; }
    }

    /* Controls, rule summary, status */
    .bz-controls { display:flex; justify-content:center; gap:16px; margin-top:18px; }
    .bz-btn { display:inline-block; padding:12px 28px; border:none; border-radius:8px;
      font-size:15px; font-weight:600; cursor:pointer; transition:background .15s, transform .08s; }
    .bz-btn:hover { transform:translateY(-1px); }
    .bz-btn-cross { background:#2563eb; color:#fff; min-width:170px; }
    .bz-btn-cross:hover { background:#1d4ed8; }
    .bz-btn-cross:disabled,
    .bz-btn-exit:disabled { opacity:.45; cursor:not-allowed; transform:none; }
    .bz-btn-exit { background:#6b7280; color:#fff; min-width:190px; }
    .pay-table { border-collapse:collapse; margin:12px auto; font-size:15px; min-width:320px; }
    .pay-table th, .pay-table td { border:1px solid #cbd5e1; padding:7px 14px; text-align:left; }
    .pay-table th { background:#eef2ff; font-weight:600; }
    .pay-table td.amt { text-align:right; font-weight:700; white-space:nowrap; }
    .pay-box { background:#fefce8; border:2px solid #eab308; border-radius:10px; padding:14px 18px; margin:14px 0; }
    .pay-box h4 { margin:0 0 6px; }
    .bz-pay-strip { text-align:center; font-size:14.5px; color:#1e293b; background:#fefce8; border:1px solid #eab308; border-radius:8px; padding:8px 12px; margin:10px auto 0; max-width:620px; }
    .bz-btn-exit:hover { background:#4b5563; }
    .bz-btn-primary { background:#2563eb; color:#fff; }
    .bz-btn-primary:hover { background:#1d4ed8; }
    .bz-btn-ghost { background:#e2e8f0; color:#334155; }
    .bz-btn-ghost:hover { background:#cbd5e1; }

    .bz-status { text-align:center; margin-top:14px; min-height:22px; font-size:14px; color:#374151; }
    .bz-rule-area { margin:4px 0 14px; font-size:14px; line-height:1.55; color:#334155; }
    .bz-rule-area.has-rule { padding:12px 16px; border-radius:8px;
      background:#fef9c3; border:1px solid #eab308; }
    .bz-outcome-msg { font-size:16px; line-height:1.6; margin:18px 0 24px; text-align:center;
      padding-left:16px; }
    .bz-outcome-safe { border-left:5px solid #22c55e; }
    .bz-outcome-pop  { border-left:5px solid #ef4444; }
    .bz-outcome-exit { border-left:5px solid #6b7280; }

    /* Matching spinner */
    .bz-matching-spinner { display:inline-block; width:40px; height:40px;
      border:4px solid #e5e7eb; border-top:4px solid #2563eb;
      border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

    /* ---- Briefing documents ----
       Styled to look like formal briefing sheets shown to each participant
       at their station. The participant sees both: first the sheet that
       was shown to the other participant, then their own. The asymmetry
       of informational access (the participant has read the partner's
       sheet; the partner has only read their own) is the theory-of-mind
       setup that carries the "they don't expect you" claim. */
    /* 2026-04-26: briefing typography overhauled for legibility. */
    .bz-brief { max-width:720px; margin:0 auto; background:#fafaf7;
      border:1px solid #cbd5e1; border-radius:10px; padding:34px 42px 30px;
      box-shadow:0 2px 8px rgba(0,0,0,.05); font-family:"Inter","Segoe UI",Arial,sans-serif;
      color:#1e293b; line-height:1.65; }
    .bz-brief-kicker { font-size:14px; letter-spacing:1px; color:#374151;
      text-transform:uppercase; margin-bottom:6px; font-weight:600; }
    .bz-brief-title { font-size:26px; font-weight:700; letter-spacing:.1px;
      margin:0 0 6px; color:#0f172a; line-height:1.25; }
    .bz-brief-subtitle { font-size:15px; color:#475569; margin:0 0 24px; }
    .bz-brief hr.bz-brief-rule { border:none; border-top:1px solid #cbd5e1;
      margin:14px 0 22px; }
    .bz-brief-section { margin-bottom:22px; padding:6px 0 6px 16px;
      border-left:3px solid #cbd5e1; }
    .bz-brief-section h4 { font-size:16px; letter-spacing:.2px; color:#0f172a;
      text-transform:none; margin:0 0 10px; font-weight:700; }
    .bz-brief-section p, .bz-brief-section ul { font-size:16px; margin:0 0 8px;
      line-height:1.6; color:#1e293b; }
    .bz-brief-section ul { padding-left:22px; }
    .bz-brief-section li { margin-bottom:8px; }
    .bz-brief-thumb { display:flex; justify-content:center; align-items:center;
      margin:18px 0 8px; }
    .bz-brief-footnote { font-size:13.5px; color:#475569; font-style:italic;
      border-top:1px solid #e2e8f0; padding-top:14px; margin-top:20px;
      line-height:1.55; }

    /* Role badge for the role-assignment screen */
    .bz-role-card { display:inline-block; min-width:220px; padding:22px 28px;
      border-radius:10px; background:#fff; border:2px solid #2563eb;
      box-shadow:0 2px 8px rgba(37,99,235,.15); text-align:center; margin:4px 6px; }
    .bz-role-card.partner { border-color:#94a3b8; box-shadow:0 2px 6px rgba(0,0,0,.05);
      opacity:.9; }
    .bz-role-kicker { font-size:13px; letter-spacing:1.5px; color:#475569;
      text-transform:uppercase; margin-bottom:6px; font-weight:600; }
    .bz-role-name { font-size:22px; font-weight:700; color:#0f172a;
      letter-spacing:.4px; }

    /* ---- Demo layout ----
       Two scenes side by side: the participant's bird's-eye (compact 420x220)
       and the partner's POV perspective (240x260). */
    .bz-demo-caption { background:#f8fafc; border-radius:8px; padding:12px 16px;
      margin-bottom:14px; min-height:64px; font-size:15px; line-height:1.55; text-align:center; }
    .bz-demo-controls { display:flex; justify-content:center; gap:12px; margin-top:16px; }
    .bz-poV-split { display:flex; gap:22px; justify-content:center; align-items:flex-start;
      flex-wrap:wrap; }
    .bz-poV-box { border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px;
      background:#fcfcfd; }
    .bz-poV-title { text-align:center; font-weight:600; font-size:13px;
      color:#334155; margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }

    /* Small game scene used in the demos (your view). Extra height for
       the dartboard below the zone, matching the main scene proportions. */
    .bz-scene-demo { position:relative; width:420px; height:232px;
      background:#f1f5f9; border-radius:10px; overflow:hidden;
      box-shadow:0 2px 6px rgba(0,0,0,.06); }
    .bz-scene-demo .bz-road-v { left:178px; width:70px; }
    .bz-scene-demo .bz-zone-start { left:30px;  top:80px;  width:110px; height:70px;
      border-width:2px; }
    .bz-scene-demo .bz-zone-goal  { left:290px; top:80px;  width:110px; height:70px; }
    .bz-scene-demo .bz-zone-cross { left:155px; top:38px; width:115px; height:154px; }
    .bz-scene-demo .bz-road-strip { left:178px; top:38px; width:70px; height:154px; padding-top:10px; }
    .bz-scene-demo .bz-road-strip-text { font-size:10px; }
    .bz-scene-demo .bz-dartboard { left:213px; top:214px; width:28px; height:28px; }
    .bz-scene-demo .bz-top-strip { top:6px; height:20px; }
    .bz-scene-demo .bz-strip-cell.start  { left:30px;  width:110px; font-size:10px; }
    .bz-scene-demo .bz-strip-cell.cross  { left:155px; width:115px; font-size:10px; }
    .bz-scene-demo .bz-strip-cell.goal   { left:290px; width:110px; font-size:10px; }
    .bz-scene-demo .bz-balloon { transition:left 2.5s ease-in-out, width .2s linear, height .2s linear; }

    /* Partner's POV — one-point perspective view of their own task.
       Sky at top, perspective road receding to a vanishing point near the
       dartboard, coloured strip on the road at mid-distance (carrying the
       partner's rule text, upright from their angle), dart visible on the
       near section of track, and a control bar at the bottom suggesting
       the "hold to advance" button. Rendered as inline SVG for pixel
       precision. */
    .bz-pov-scene { width:240px; height:260px; border-radius:10px;
      overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,.06); background:#0f172a; }
    .bz-pov-caption { font-size:13px; color:#475569; text-align:center;
      margin-top:6px; letter-spacing:.3px; }

    /* --- 2026-04-26 focus-group additions --------------------------------
       (a) Adjacent-item visual differentiation in surveyLikert blocks.
       Straightlining literature (Kim et al. 2019; Couper 2008) finds that
       even minimal visual chunking between adjacent prompts suppresses
       copy-response patterns. We add a hairline rule + extra top padding
       between statements so consecutive items don't read as duplicates.
       Counter-targets :first-of-type so the first item doesn't get a rule
       at the top of the block. */
    #jspsych-survey-likert-form > .jspsych-survey-likert-statement {
      margin-top: 22px; padding-top: 16px;
      border-top: 1px solid #e2e8f0; font-weight: 500;
    }
    #jspsych-survey-likert-form > .jspsych-survey-likert-statement:first-of-type {
      border-top: none; margin-top: 0; padding-top: 0;
    }
    #jspsych-survey-likert-form > ul.jspsych-survey-likert-opts {
      padding-bottom: 8px; margin-bottom: 0;
    }

    /* (b) Compressed live-trial rule banner. Replaces the long ruleSummary
       prose during the timed trial — the full text lives in the pre-trial
       briefing where the participant reads it untimed. JP's read-while-
       deciding signal: the long banner competed for attention during the
       12 s decision window. Compressed text + visual subordination
       (smaller font, slate-500) keeps the rule content reachable without
       making it the visual focus. */
    .bz-rule-area-short {
      margin: 4px 0 12px; padding: 8px 14px;
      font-size: 13px; line-height: 1.5; color: #475569;
      background: #fef9c3; border-left: 3px solid #ca8a04;
      border-radius: 4px;
    }

    /* (c) In-task feedback widget. Visible on every screen during the
       focus-group runs only (gated by ?focus_group=1 URL param at runtime).
       Lets RAs flag any screen with a free-text comment without breaking
       flow. Comments + trial index + timestamp are appended to a global
       array and dumped into jsPsych data on study end. */
    #fg-flag-btn {
      position: fixed; bottom: 14px; right: 14px; z-index: 99999;
      background: #fef3c7; color: #78350f;
      border: 1px solid #f59e0b; padding: 8px 14px;
      border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.1);
      font-family: inherit;
    }
    #fg-flag-btn:hover { background: #fde68a; }
    #fg-flag-overlay {
      position: fixed; inset: 0; z-index: 99998;
      background: rgba(15,23,42,0.55);
      display: flex; align-items: center; justify-content: center;
    }
    #fg-flag-modal {
      background: white; padding: 22px 26px; border-radius: 10px;
      max-width: 480px; width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      font-family: inherit;
    }
    #fg-flag-modal h3 { margin: 0 0 6px; font-size: 16px; color: #1e293b; }
    #fg-flag-modal p { margin: 0 0 10px; font-size: 13px; color: #64748b; }
    #fg-flag-modal textarea {
      width: 100%; min-height: 90px; padding: 10px;
      border: 1px solid #cbd5e1; border-radius: 6px;
      font-family: inherit; font-size: 14px; resize: vertical;
      box-sizing: border-box;
    }
    #fg-flag-modal .fg-buttons {
      margin-top: 14px; display: flex; gap: 10px; justify-content: flex-end;
    }
    #fg-flag-modal button {
      padding: 8px 16px; border-radius: 6px; border: none;
      font-size: 14px; font-weight: 500; cursor: pointer;
    }
    #fg-flag-modal .fg-btn-save { background: #2563eb; color: white; }
    #fg-flag-modal .fg-btn-cancel { background: #e2e8f0; color: #1e293b; }
    /* End focus-group additions ----------------------------------------- */

    /* ---- ToM panel (added 2026-05-05 after focus group) ----
       Side-by-side what-you-know vs what-the-partner-knows panel inserted at
       the top of the Balloon participant's own briefing. Spatially partitions
       the asymmetric-knowledge content so the participant does not have to
       reconstruct it from prose alone. Mobile (≤720px) stacks vertically. That
       stacked layout is only a fallback for narrow desktop windows: phones and
       tablets never reach this screen, because the desktop-only gate below
       blocks them at load. Prolific itself does NOT filter by device — its
       device tick boxes are display-only — so that gate is the only enforcement.
       Visual scheme:
         Self panel — light navy tint, navy bullets with check glyphs.
         Partner panel — neutral grey tint, grey bullets with cross glyphs
           on negation items, indicating "they do NOT know X". */
    .bz-tom-panel { display:grid; grid-template-columns: 1fr 8px 1fr;
      gap:0; margin: 8px 0 24px 0; border:1px solid #e2e8f0;
      border-radius:10px; overflow:hidden; }
    .bz-tom-col { padding:18px 22px; }
    .bz-tom-self { background:#eef2ff; }
    .bz-tom-partner { background:#f8fafc; }
    .bz-tom-divider { background:#e2e8f0; }
    .bz-tom-header { display:flex; align-items:center; gap:10px;
      margin-bottom:6px; }
    .bz-tom-icon { display:inline-flex; align-items:center;
      justify-content:center; min-width:32px; height:24px;
      padding: 0 9px; border-radius:12px; font-size:11px;
      letter-spacing:.5px; font-weight:700;
      background:#1E2761; color:#ffffff; }
    .bz-tom-icon-partner { background:#cbd5e1; color:#334155; }
    .bz-tom-label { font-size:15px; font-weight:700; color:#1F2937;
      font-family: Georgia, serif; }
    .bz-tom-tag { font-size:13px; color:#475569;
      margin: 4px 0 8px 0; text-transform:uppercase;
      letter-spacing:.6px; font-weight:600; }
    .bz-tom-list { list-style:none; padding:0; margin:0; }
    .bz-tom-list li { font-size:15px; color:#1F2937; margin:8px 0;
      padding-left:24px; position:relative; line-height:1.55; }
    .bz-tom-list li::before { content:"\2713"; position:absolute;
      left:2px; top:0; color:#1E2761; font-weight:700; font-size:15px; }
    .bz-tom-list-partner li::before { content:"\2022";
      color:#64748b; }
    .bz-tom-list-partner li.bz-tom-cross::before { content:"\2715";
      color:#C3554F; font-weight:700; }
    @media (max-width: 720px) {
      .bz-tom-panel { grid-template-columns: 1fr; }
      .bz-tom-divider { height:1px; width:100%; }
    }
    /* End ToM panel additions -------------------------------------------- */

    /* ---- Desktop-only block screen (added 2026-05-05) ---- */
    .bz-mobile-block { max-width:520px; margin:80px auto; padding:36px 32px;
      text-align:center; font-family: system-ui, -apple-system, sans-serif;
      background:#fff; border:1px solid #e2e8f0; border-radius:12px;
      box-shadow:0 4px 16px rgba(15,23,42,.06); }
    .bz-mobile-block h1 { color:#1E2761; font-size:22px; margin:0 0 14px 0;
      font-family: Georgia, serif; }
    .bz-mobile-block p { color:#475569; font-size:15px; line-height:1.6;
      margin:10px 0; }
    /* End desktop-only block --------------------------------------------- */
    /* 26/11/2026 render fixes, layout only (no wording or logic change):
       number inputs were a small unstyled box with the placeholder cut off;
       a disabled Continue turned blue on hover and looked clickable;
       Likert scales under a short question shrank until the end labels wrapped
       (a minimum width only: scales under long questions are unchanged). */
    #jspsych-survey-text-form input[type=number] { width: 8em; padding: 6px 8px; font: inherit; border: 1px solid #cbd5e1; border-radius: 6px; }
    .jspsych-btn:disabled:hover { background: #eee; }
    #jspsych-survey-likert-form { min-width: 520px; }
    /* 26/11/2026: "Balloon size" strip removed from view (Ali): its bar never
       displayed (inline span, 0 x 0 px) and a working gauge would let
       participants time the hidden 12 s pop. The JS still writes to it. */
    .bz-header { display: none; }
  </style>
</head>
<body></body>
<noscript>
  <div class="bz-mobile-block">
    <h1>JavaScript required</h1>
    <p>This study needs JavaScript enabled in your browser. Please enable it and reload this page, or open the study link on a desktop or laptop browser with JavaScript switched on.</p>
    <p>If you cannot do that, please go back to the Prolific tab and click "Cancel participation" so the slot is released to someone else.</p>
  </div>
</noscript>
<script>
// =========================================================
// DESKTOP-ONLY GATE (added 2026-05-05, iPad case added 2026-07-31)
// This gate is the ONLY thing enforcing desktop-only. Prolific's device
// tick boxes are display-only — its own form says "These options don't
// filter participants" — so there is no platform-side backstop and no
// protection against UA spoofing. The live task involves precise click
// timing and a side-by-side ToM panel; both degrade on small screens.
// Blocked participants are asked to return the submission so the slot
// recycles.
// =========================================================
(function() {
  const ua = navigator.userAgent || '';
  const uaMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|webOS/i.test(ua);
  // iPadOS 13+ Safari sends a Macintosh UA by default, so the /iPad/ above
  // never fires on a current iPad. maxTouchPoints is 0 or 1 on a Mac and >1
  // on an iPad, and Apple sells no touchscreen Mac, so Macintosh + touch = iPad.
  // Scoped to Macintosh on purpose: touchscreen Windows laptops report
  // "Windows NT" and are ordinary desktop machines, so they pass through.
  const iPadAsDesktop = /Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1;
  // No width fallback: a resized desktop window should not be blocked.
  if (uaMobile || iPadAsDesktop) {
    document.body.innerHTML = ''
      + '<div class="bz-mobile-block">'
      +   '<h1>Desktop or laptop required</h1>'
      +   '<p>This study uses a side-by-side layout and precise click timing that do not work reliably on phones or tablets.</p>'
      +   '<p>If you have a desktop or laptop, you can open this same study link on that computer and carry on from the beginning.</p>'
      +   '<p>If you cannot, please go back to the Prolific tab and click "Cancel participation" so the slot is released to someone else. Returning a study because of an incompatible device is not counted against you.</p>'
      + '</div>';
    throw new Error('study3_blocked_mobile_device');
  }
})();

// =========================================================
// STUDY 3 — CROSSING-ZONE (BALLOON / DART) TASK
// Rules and Trust project, Study 3 redesign (April 2026)
//
// Four between-subjects conditions (N ≈ 400, ~100 per cell):
//   1. Control              — zone yellow; no signal, no rule
//   2. Signal               — dart's rail in-zone cycles red/green
//   3. Signal + Rule        — partner told: stop on red, cross on green (≈75% compliant)
//   4. Signal + Rule + Fine — as (3) plus token fine; partner 100% compliant
//
// Participant controls a balloon that auto-inflates. A (simulated) partner
// controls a dart advancing along a rail toward a dartboard — they earn a
// reward for hitting it. The dart is never rendered in the participant's
// scene during the main task. Collision pops the balloon; the dart is
// unaffected. Safe-exit is available until crossing starts.
// =========================================================

const urlParams = new URLSearchParams(window.location.search);
const PROLIFIC_PID = urlParams.get('PROLIFIC_PID') || 'PREVIEW';
const STUDY_ID     = urlParams.get('STUDY_ID')     || 'PREVIEW';
const SESSION_ID   = urlParams.get('SESSION_ID')   || 'PREVIEW';
// On Prolific if ANY of the three IDs arrived (the August Study 1 pilot
// arrived without PROLIFIC_PID, which skipped the completion redirect).
const ON_PROLIFIC = PROLIFIC_PID !== 'PREVIEW' || SESSION_ID !== 'PREVIEW' || STUDY_ID !== 'PREVIEW';
const FORCE_COND   = urlParams.get('cond');   // piloting override: ?cond=control|signal|rule|rule_fine
const PROLIFIC_COMPLETION_URL = 'https://app.prolific.com/submissions/complete?cc=CIOOLCS8';
// One Prolific completion code per task outcome (Ali, 27/09/2026). Each code
// is set up in Prolific as a custom completion code that approves the
// submission and awards that outcome's bonus automatically. This pays the
// bonus whatever the participant answers at re-consent, WITHOUT keeping their
// research data: if they decline, nothing is deposited, and the only record
// of their outcome is which code Prolific received with their Prolific ID.
// The three codes below are those of the CALIBRATION PILOT draft on Prolific
// (study 6b0431c0e0cc3575aefb1a96, created 23/11/2026); the base code
// CIOOLCS8 is that draft's default (manual review) path. Each outcome code
// approves automatically; the bonus (GOAL = 9 tokens = £3.60, EXIT = 4 tokens
// = £1.60, POP = 0) is then paid in Prolific by outcome label. The MAIN study
// will get its own codes when it is created.
const COMPLETION_CODES = {
  safe:      'C133LD2E',
  safe_exit: 'CGX5XSZT',
  self_pop:  'CBDBP7MO'
};
function completionUrlForOutcome() {
  const code = COMPLETION_CODES[window.S3_OUTCOME];
  // No recorded outcome (should not happen after the task) -> base code,
  // which is held for manual review in Prolific and paid the base plus the
  // Goal bonus by default (protocol v10, 27/09/2026).
  return code ? 'https://app.prolific.com/submissions/complete?cc=' + code : PROLIFIC_COMPLETION_URL;
}

// DataPipe (pipe.jspsych.org) -> Dataverse data deposit. Experiment ID set at
// DataPipe registration; the save trial runs after re-consent, before the
// final screen, and is skipped in focus-group mode (local download there).
const DATAPIPE_EXPERIMENT_ID = 'cOKwQCDD04Nm';
const DATA_FILENAME = 'study3_' + PROLIFIC_PID + '_' + jsPsych_randomFileTag();
function jsPsych_randomFileTag() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '.csv';
}

// 2026-04-26: focus-group mode. Activated by ?focus_group=1 in the URL.
// Triggers (a) the in-task feedback widget, (b) a session-ID display +
// data-download screen at the end instead of the Prolific redirect.
// Default OFF so live Prolific runs are unaffected.
const FOCUS_GROUP = urlParams.get('focus_group') === '1';
// Focus-group RA attribution. Prompt for first name on load so flags and
// the saved JSON file are attributable to a specific RA. Cancel / blank
// falls back to 'anon'. Stripped to alphanumerics to keep it filename-safe.
let FG_RA_NAME = null;
if (FOCUS_GROUP) {
  const raw = (typeof window.prompt === 'function')
    ? (window.prompt('Focus-group session. Please type your first name so your flags can be attributed to you:') || '')
    : '';
  FG_RA_NAME = raw.trim().replace(/[^a-zA-Z0-9]/g, '').slice(0, 12) || 'anon';
}
// Short, copy-paste-friendly session identifier for focus-group runs so RAs
// can paste it into the Google Form alongside their data file. Includes the
// RA name when available so Dan/Ali can match files to people.
const FG_SESSION_ID = (function() {
  const t = Date.now().toString(36).toUpperCase();
  const r = Math.random().toString(36).slice(2, 6).toUpperCase();
  const prefix = FG_RA_NAME ? (FG_RA_NAME + '-') : '';
  return 'FG-' + prefix + t.slice(-6) + '-' + r;
})();

// Focus-group feedback log — populated by the in-task widget and dumped
// into jsPsych data on completion.
window.fgFeedbackLog = [];

const jsPsych = initJsPsych({
  show_progress_bar: true,
  auto_update_progress_bar: true,
  on_trial_start: function() {
    // jsPsych re-renders the body on each trial transition, which wipes
    // the focus-group feedback button. Re-inject on every trial start.
    fgInjectFeedbackWidget();
  },
  on_finish: function() {
    // Attach feedback log + session metadata to the saved data.
    jsPsych.data.addProperties({
      fg_focus_group_mode: FOCUS_GROUP,
      fg_session_id: FOCUS_GROUP ? FG_SESSION_ID : null,
      fg_ra_name: FOCUS_GROUP ? FG_RA_NAME : null,
      fg_feedback_log: JSON.stringify(window.fgFeedbackLog || [])
    });
    // Live (Prolific) runs redirect to completion URL; focus-group runs
    // stay on the final download screen rendered as the last timeline trial.
    if (!FOCUS_GROUP && ON_PROLIFIC && !window.S3_NO_CONSENT) {
      window.location.href = completionUrlForOutcome();
    }
  }
});

// In-task feedback widget — injected once per page load when in focus-group
// mode. Idempotent (re-runs are no-ops). Widget persists across jsPsych
// trials because it's appended directly to <body> outside the jsPsych root.
function fgInjectFeedbackWidget() {
  if (!FOCUS_GROUP) return;
  if (document.getElementById('fg-flag-btn')) return;
  const btn = document.createElement('button');
  btn.id = 'fg-flag-btn';
  btn.type = 'button';
  btn.textContent = '⚑ Flag this screen';
  btn.onclick = fgOpenFeedbackModal;
  document.body.appendChild(btn);
}
function fgOpenFeedbackModal() {
  if (document.getElementById('fg-flag-overlay')) return;
  const overlay = document.createElement('div');
  overlay.id = 'fg-flag-overlay';
  overlay.innerHTML = `
    <div id="fg-flag-modal">
      <h3>Flag this screen</h3>
      <p>What's confusing, broken, or worth flagging here? Brief is fine.</p>
      <textarea id="fg-flag-text" placeholder="e.g. The rule banner ran past the timer and I didn't have time to read it."></textarea>
      <div class="fg-buttons">
        <button type="button" class="fg-btn-cancel" id="fg-flag-cancel">Cancel</button>
        <button type="button" class="fg-btn-save" id="fg-flag-save">Save flag</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('fg-flag-text').focus();
  document.getElementById('fg-flag-cancel').onclick = fgCloseFeedbackModal;
  document.getElementById('fg-flag-save').onclick = function() {
    const text = (document.getElementById('fg-flag-text').value || '').trim();
    if (!text) { fgCloseFeedbackModal(); return; }
    const trialIdx = jsPsych.data.get().count();
    const elapsedMs = Math.round(jsPsych.getTotalTime());
    // Capture which screen the RA was on when they flagged. jsPsych's
    // getCurrentTrial returns the in-progress trial including its data
    // parameter — so we get measure / screen_id / label if defined, plus
    // the trial-type plugin name.
    let screen_id = 'unknown';
    let trial_type = 'unknown';
    try {
      const ct = (typeof jsPsych.getCurrentTrial === 'function') ? jsPsych.getCurrentTrial() : null;
      if (ct) {
        if (ct.data && (ct.data.measure || ct.data.screen_id || ct.data.label)) {
          screen_id = ct.data.measure || ct.data.screen_id || ct.data.label;
        }
        if (ct.type && ct.type.info && ct.type.info.name) {
          trial_type = ct.type.info.name;
        }
      }
    } catch (e) { /* keep defaults */ }
    window.fgFeedbackLog.push({
      trial_idx: trialIdx,
      screen_id: screen_id,
      trial_type: trial_type,
      elapsed_ms: elapsedMs,
      timestamp_iso: new Date().toISOString(),
      comment: text
    });
    fgCloseFeedbackModal();
  };
  // Esc to cancel.
  overlay.addEventListener('keydown', function(e) { if (e.key === 'Escape') fgCloseFeedbackModal(); });
}
function fgCloseFeedbackModal() {
  const o = document.getElementById('fg-flag-overlay');
  if (o) o.parentNode.removeChild(o);
}
// Inject as soon as DOM is ready, then re-check on each trial start in case
// jsPsych blew the body away.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', fgInjectFeedbackWidget);
} else {
  fgInjectFeedbackWidget();
}

// =========================================================
// CONDITION ASSIGNMENT
// =========================================================
const CONDITIONS = ['control', 'signal', 'rule', 'rule_fine'];
const assignedCondition = (FORCE_COND && CONDITIONS.includes(FORCE_COND))
  ? FORCE_COND
  : jsPsych.randomization.sampleWithoutReplacement(CONDITIONS, 1)[0];

const condConfig = {
  control: {
    label: 'Control',
    hasSignal: false,
    hasRule: false,
    hasFine: false,
    ruleSummary: '',
    // ruleSummaryShort: live-trial reminder, kept brief so it doesn't compete
    // with the decision controls during the timed window. Full text lives in
    // the pre-trial briefing.
    ruleSummaryShort: ''
  },
  signal: {
    label: 'Signal',
    hasSignal: true,
    hasRule: false,
    hasFine: false,
    ruleSummary: 'On the other participant\'s screen, the section of rail inside the crossing zone is shown in red. Their instructions don\'t mention this red section.',
    ruleSummaryShort: 'Their rail has a red zone in the crossing area. Their instructions don\'t mention it.'
  },
  rule: {
    label: 'Rule',
    hasSignal: true,
    hasRule: true,
    hasFine: false,
    ruleSummary: 'On the other participant\'s screen, the section of rail inside the crossing zone is shown in red, with <strong>Wait</strong> written on it. Their instructions tell them: <strong>the rule is to wait 10 seconds at the red section before continuing.</strong> Their instructions don\'t mention any consequence for ignoring this.',
    ruleSummaryShort: 'Their rail: red zone marked <strong>Wait</strong>. Their instructions: the rule is to wait 10 seconds at the red section.'
  },
  rule_fine: {
    label: 'Rule + Enforcement',
    hasSignal: true,
    hasRule: true,
    hasFine: true,
    ruleSummary: 'On the other participant\'s screen, the section of rail inside the crossing zone is shown in red, with <strong>Wait</strong> and <strong>−5</strong> written on it. Their instructions tell them: <strong>the rule is to wait 10 seconds at the red section before continuing. If they continue before the 10 seconds have passed, they lose 5 tokens.</strong>',
    ruleSummaryShort: 'Their rail: red zone marked <strong>Wait −5</strong>. Their instructions: the rule is to wait 10 seconds, or lose 5 tokens.'
  }
};
const cfg = condConfig[assignedCondition];

// =========================================================
// TASK PARAMETERS — chosen with precedent, not arbitrary
//   SELF_POP_SEC (12)            — Commit deadline. Trust-under-time-pressure
//                                   paradigms use 7–10 s windows (Rand,
//                                   Greene & Nowak 2012 used a 10 s
//                                   constraint for intuitive cooperation;
//                                   Halali, Bereby-Meyer & Meiran 2013 used
//                                   7–10 s; Schulz et al. 2014 PLOS ONE used
//                                   10 s). We sit slightly above the
//                                   standard time-pressure ceiling (12 s)
//                                   to give the participant room to read
//                                   the zone marker and deliberate over the
//                                   rule, while remaining short enough to
//                                   prevent the strategic "wait out any
//                                   implied dart window" response that
//                                   would wash out the trust manipulation.
//                                   A longer window — e.g. the 25–30 s BART
//                                   trial (Lejuez et al. 2002) — is
//                                   inappropriate here because BART uses
//                                   multi-pump continuous choice, not a
//                                   single binary commit: that paradigm's
//                                   time pressure is distributed across
//                                   pumps, not concentrated in one decision.
//   CROSSING_DURATION (4 s)      — FHWA assumes a 4 ft/s pedestrian walking
//                                   speed; crossing a 5 m shared zone at
//                                   the global mean pedestrian speed of
//                                   ≈1.2 m/s takes 4.1 s.
//   CROSSING_PAYOFF / SAFE_EXIT  — Safe-exit/successful ratio of 0.3 sits
//                                   inside the BART bank-value norm of
//                                   0.3–0.5× maximum trial reward (Lejuez
//                                   et al. 2002; Pleskac 2008).
// NOTE: the live task does not render a dart and does not compute any
// compliance outcome. The threat is purely belief-based, seeded in the
// briefing, and is never instantiated. All dart-timing scaffolding from
// the pre-redesign version (green/red phase cycling, dart-entry sampling,
// compliance Bernoulli draw) has been removed accordingly.
// NOTE (no visible countdown): the balloon grows continuously and the size
// bar fills progressively, giving an ecological, graded deadline cue
// without an explicit numerical timer. A numerical countdown would invite
// a pure strategic response ("wait until ~1 s remains, then cross")
// independent of trust, collapsing the manipulation. Hidden-endpoint
// pressure with visible growth mirrors BART (Lejuez et al. 2002) where the
// explosion point is not disclosed numerically; ecological-rationality
// accounts (Gigerenzer & Todd 1999) favour implicit perceptual cues over
// explicit clocks when the decision should be driven by internal
// confidence rather than timer optimisation.
// =========================================================
const SELF_POP_SEC        = 12;
// 2026-04-26: CROSSING_DURATION raised 4 → 8 s. Slower cross underscores
// that the commit is unstoppable, gives participants more time to register
// the no-going-back nature of the choice, and crucially makes the felt
// risk of the dart passing during the cross realistic — at 4 s the
// crossing was over before the partner-collision risk could meaningfully
// be felt; at 8 s the cross occupies a substantial slice of the 12 s
// pop-deadline window, so participants experience the trust decision under
// genuine perceived overlap risk.
const CROSSING_DURATION   = 8;
const BALLOON_BASE_PX     = 48;    // diameter at t = 0
const BALLOON_MAX_PX      = 88;    // diameter at self-pop. Height of rendered SVG is
                                   // 1.15 × diameter; at max this gives a 101 px tall
                                   // balloon that sits inside the 120 px tall start/goal
                                   // zones with ~9.5 px of vertical clearance each side.
const CROSSING_PAYOFF     = 9;   // 27/09/2026: was 10 (pilot). See Reports/Study3_Bonus_Design_Research_2026-09-27.md
const SAFE_EXIT_PAYOFF    = 4;   // 27/09/2026: was 3. Exit/Goal ≈ 0.44 so crossing no longer dominates at a ~50% belief
const SELF_POP_PAYOFF     = 0;
// Performance-dependent bonus (Ali, Aug 2026; amounts set by Ali 27/09/2026
// from Reports/Study3_Bonus_Design_Research_2026-09-27.md): base pay £2.25
// (keeps the approved protocol's £9/hr line true up to 15 min;
// Prolific requires its £6/hr minimum from the base alone), plus a real bonus
// by outcome: Goal 9 tokens = £3.60, Safe exit 4 tokens = £1.60, pop 0.
// Paid through Prolific via one completion code per outcome (see
// COMPLETION_CODES). Participants see amounts converted on Prolific.
const TOKEN_VALUE_GBP     = 0.40;
const BASE_PAY_GBP        = 2.25;   // 27/09/2026: was 1.80; £9/hr at the 15-minute top of the stated 10–15 minutes
function gbp(x) { return '£' + x.toFixed(2); }
function tokensToGBP(t) { return gbp(t * TOKEN_VALUE_GBP); }
function totalGBP(t) { return gbp(BASE_PAY_GBP + t * TOKEN_VALUE_GBP); }
const MAX_BONUS_GBP       = tokensToGBP(CROSSING_PAYOFF);
// Fraction of the trial window during which the size bar shifts toward
// warning colour (amber → red). Graded salience cue to reduce accidental
// self-pops without disclosing the exact deadline. Traffic-light colour
// progression chosen for ecological familiarity (Wickens & Hollands 2000
// on graded interface urgency cues).
const WARNING_WINDOW_FRAC = 0.25;

// Layout constants (in pixels, relative to the 680x340 scene)
const START_CENTER_X = 140;   // centre of start zone
const GOAL_CENTER_X  = 560;   // centre of goal zone
const ZONE_CENTER_Y  = 180;   // common vertical centre of all zones
const ROAD_CENTER_X  = 350;   // centre of the dart's vertical rail (matches crossing zone centre)

// Demo scene layout (compact 420 x 220 scene used in demos)
const DEMO_START_X  = 85;
const DEMO_GOAL_X   = 345;
const DEMO_CENTER_Y = 115;
const DEMO_ROAD_X   = 213;

// =========================================================
// SVG HELPERS
// =========================================================
function balloonSvg(diameterPx) {
  return `<svg width="${diameterPx}" height="${Math.round(diameterPx * 1.15)}" viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bgrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#fca5a5"/>
        <stop offset="60%" stop-color="#ef4444"/>
        <stop offset="100%" stop-color="#b91c1c"/>
      </radialGradient>
    </defs>
    <ellipse cx="50" cy="46" rx="40" ry="44" fill="url(#bgrad)" stroke="#991b1b" stroke-width="1.5"/>
    <ellipse cx="36" cy="30" rx="8" ry="12" fill="rgba(255,255,255,.4)"/>
    <polygon points="46,88 54,88 50,96" fill="#b91c1c"/>
    <line x1="50" y1="96" x2="50" y2="112" stroke="#475569" stroke-width="1.2"/>
  </svg>`;
}

// Bird's-eye dart sprite — a miniature top-down dart pointing DOWN (toward
// the dartboard at the bottom of the bird's-eye scene). Mirrors the
// anatomy of the POV dart (fletching, barrel, collar, tip) but read from
// above. Width 14, height 30. Centre at local (7, 15).
function dartBirdsEyeSvg(scale) {
  const s = scale || 1;
  const w = 14 * s, h = 30 * s;
  return `<svg viewBox="0 0 14 30" width="${w}" height="${h}"
            xmlns="http://www.w3.org/2000/svg" style="display:block;">
    <!-- Fletching (four-feather silhouette) at the tail (top in bird's-eye) -->
    <polygon points="1,0 7,3 13,0 11,7 7,5 3,7" fill="#2563eb" stroke="#1e3a8a" stroke-width=".5"/>
    <!-- Shaft -->
    <rect x="6.2" y="6" width="1.6" height="4" fill="#475569"/>
    <!-- Collar -->
    <rect x="5.4" y="10" width="3.2" height="2" fill="#1e293b"/>
    <!-- Barrel -->
    <rect x="5.6" y="12" width="2.8" height="9" fill="#94a3b8" stroke="#334155" stroke-width=".4"/>
    <!-- Upper body (tapered) -->

// Cartoon balloon pop. Applies the .bz-pop class (which does the punch +
// snap-collapse via CSS keyframe), and injects ~10 fragment shards and 8
// radial impact lines as ephemeral sibling elements inside the balloon's
// positioned parent. Caller only needs to call popBalloon(balloonEl) in
// place of balloonEl.classList.add('bz-pop'). All injected nodes clean
// themselves up via setTimeout after their animation completes.
function popBalloon(balloonEl) {
  if (!balloonEl) return;
  balloonEl.classList.add('bz-pop');
  const parent = balloonEl.parentElement;
  if (!parent) return;
  const parentRect = parent.getBoundingClientRect();
  const rect = balloonEl.getBoundingClientRect();
  const cx = rect.left - parentRect.left + rect.width  / 2;
  const cy = rect.top  - parentRect.top  + rect.height / 2;

  // Fragment shards flung radially with a slight downward gravity bias.
  const fragColors = ['#dc2626', '#ef4444', '#b91c1c', '#991b1b'];
  const N_FRAG = 10;
  for (let i = 0; i < N_FRAG; i++) {
    const f = document.createElement('div');
    const angle = (i / N_FRAG) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
    const dist  = 38 + Math.random() * 46;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist + 8;
    const rot = (Math.random() - 0.5) * 540;
    f.className = 'bz-pop-frag';
    f.style.cssText =
      'left:' + (cx - 3) + 'px; top:' + (cy - 5) + 'px;' +
      'background:' + fragColors[i % fragColors.length] + ';' +
      '--dx:' + dx + 'px; --dy:' + dy + 'px; --rot:' + rot + 'deg;';
    parent.appendChild(f);
    setTimeout(function() { if (f.parentElement) f.remove(); }, 420);
  }

  // Radial impact lines — classic cartoon "impact star".
  const N_RAD = 8;
  for (let i = 0; i < N_RAD; i++) {
    const r = document.createElement('div');
    const angle = (i / N_RAD) * 360;
    r.className = 'bz-pop-radial';
    r.style.cssText =
      'left:' + cx + 'px; top:' + cy + 'px; --rot:' + angle + 'deg;';
    parent.appendChild(r);
    setTimeout(function() { if (r.parentElement) r.remove(); }, 260);
  }
}

// Partner's POV — one-point perspective looking down the dart's rail toward
// the dartboard in the distance. The coloured strip on the track and its
// upright rule text sit at mid-distance; the near foreground shows the dart
// on the rail and a "hold-to-advance" control. No balloon. No crossing-zone
// framing. This is everything the partner can actually see.
//
// opts: {
//   zoneState: 'neutral' | 'green' | 'red',
//   ruleText: string | null,     // 'STOP' / 'CROSS' / 'STOP — −5' or null
//   buttonHeld: bool,            // true = pressed (dart advancing)
//   dartPosition: 0..1           // 0 = bottom foreground, 1 = at board
// }
function povSceneSvg(opts) {
  const state = opts.zoneState || 'neutral';
  const ruleText = opts.ruleText;
  const held = opts.buttonHeld;
  const dartPos = Math.max(0, Math.min(1, opts.dartPosition == null ? 0.15 : opts.dartPosition));

  // Colours
  const stripFill = state === 'green' ? '#22c55e' : state === 'red' ? '#ef4444' : '#475569';
  const stripEdge = state === 'green' ? '#15803d' : state === 'red' ? '#991b1b' : '#334155';
  const stripTextColor = state === 'green' ? '#052e16' : state === 'red' ? '#450a0a' : '#f8fafc';

  // Scene dimensions in viewBox units
  // viewBox 0 0 240 260
  // Sky:     y  0–80
  // Ground:  y 80–230
  // Dash:    y 230–260
  //
  // Perspective track: vanishing at (120, 82) — just below the horizon line.
  // Near edges at (40, 230) and (200, 230).

  // Coloured strip: occupies track between y = 145 and y = 205 (mid-distance).
  // Interpolate track edges at those y values.
  function edgesAt(y) {
    const f = (y - 82) / (230 - 82);
    const halfNear = (200 - 40) / 2; // 80
    const halfFar = (122 - 118) / 2; // 2
    const half = halfFar + (halfNear - halfFar) * f;
    return [120 - half, 120 + half];
  }
  const [sLx, sRx] = edgesAt(145);
  const [sLx2, sRx2] = edgesAt(205);

  // Dart position on the track — interpolated along the centreline.
  // dartPos 0 = near foreground (y ≈ 240, off-track into the dashboard),
  // dartPos 1 = at the dartboard (y ≈ 90).
  const dartY = 240 - dartPos * 150;
  // Dart size shrinks with distance.
  const dartScale = 0.35 + (1 - dartPos) * 0.65;

  return `
  <svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg" width="240" height="260">
    <defs>
      <linearGradient id="povsky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#0f172a"/>
        <stop offset="100%" stop-color="#334155"/>
      </linearGradient>
      <linearGradient id="povground" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#64748b"/>
        <stop offset="100%" stop-color="#94a3b8"/>
      </linearGradient>
      <linearGradient id="povtrack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#334155"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
      <radialGradient id="povglow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fde68a" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Sky -->
    <rect x="0" y="0" width="240" height="82" fill="url(#povsky)"/>
    <!-- Ground -->
    <rect x="0" y="82" width="240" height="148" fill="url(#povground)"/>
    <!-- Distant glow behind the dartboard -->
    <circle cx="120" cy="82" r="38" fill="url(#povglow)"/>

    <!-- Dartboard at the vanishing point -->
    <g transform="translate(120, 82) scale(0.3)">
      <circle cx="0" cy="0" r="48" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
      <circle cx="0" cy="0" r="40" fill="#fef3c7"/>
      <circle cx="0" cy="0" r="32" fill="#0f172a"/>
      <circle cx="0" cy="0" r="24" fill="#fef3c7"/>
      <circle cx="0" cy="0" r="16" fill="#16a34a"/>
      <circle cx="0" cy="0"  r="9" fill="#dc2626"/>
      <circle cx="0" cy="0"  r="3" fill="#fef3c7"/>
    </g>

    <!-- Perspective track (trapezoid) -->
    <polygon points="40,230 200,230 122,82 118,82"
             fill="url(#povtrack)" stroke="#1e293b" stroke-width="1"/>

    <!-- Centre dashed rail -->
    <line x1="120" y1="230" x2="120" y2="86"
          stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4 6" opacity=".35"/>

    <!-- Coloured strip on the track (where it passes through the crossing zone) -->
    <polygon points="${sLx},145 ${sRx},145 ${sRx2},205 ${sLx2},205"
             fill="${stripFill}" stroke="${stripEdge}" stroke-width="1.5"/>

    ${ruleText
      ? `<text x="120" y="192" font-family="Inter, Arial, sans-serif"
                font-size="14" font-weight="800" letter-spacing=".8"
                fill="${stripTextColor}" text-anchor="middle">${ruleText}</text>`
      : ''}

    <!-- Dart on the rail, pointing up toward the dartboard.
         Tip at local y=0 (top), fletching at local y=68 (bottom);
         outer translate positions its centre on the rail. -->
    <g transform="translate(120, ${dartY}) scale(${dartScale})">
      <g transform="translate(-10, -34)">
        <!-- Tip (sharp needle) -->
        <polygon points="8,6 12,6 10,0" fill="#64748b" stroke="#1e293b" stroke-width=".6"/>
        <!-- Upper body (tapered) -->
        <polygon points="8.5,6 11.5,6 11,32 9,32" fill="#cbd5e1" stroke="#334155" stroke-width=".6"/>
        <!-- Barrel -->
        <rect x="8" y="32" width="4" height="22" fill="#94a3b8" stroke="#334155" stroke-width=".6"/>
        <!-- Collar -->
        <rect x="7.5" y="54" width="5" height="3" fill="#1e293b"/>
        <!-- Shaft to fletching -->
        <rect x="9" y="57" width="2" height="5" fill="#475569"/>
        <!-- Fletching (feathers) -->
        <polygon points="4,62 10,60 16,62 14,68 10,65 6,68" fill="#2563eb" stroke="#1e3a8a" stroke-width=".6"/>
      </g>
    </g>

    <!-- Dashboard / control bar at the bottom -->
    <rect x="0" y="230" width="240" height="30" fill="#020617"/>
    <text x="16" y="249" font-family="Inter, Arial, sans-serif" font-size="9"
          letter-spacing="1.2" fill="#94a3b8">HOLD TO ADVANCE</text>
    <g transform="translate(206, 245)">
      <circle cx="0" cy="0" r="10"
              fill="${held ? '#ef4444' : '#1f2937'}"
              stroke="${held ? '#fca5a5' : '#475569'}" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5"
              fill="${held ? '#fca5a5' : '#374151'}"/>
    </g>
  </svg>`;
}

timeline.push({

  choices: ['Continue'],
  data: { phase: 'dart_task_intro' },
  on_load: function() {
    const povEl = document.getElementById('dti-pov');
    const holdBtn = document.getElementById('dti-hold');
    const resetBtn = document.getElementById('dti-reset');
    const hintEl  = document.getElementById('dti-hint');
    if (!povEl || !holdBtn) return;

    // Continue-gate: the jsPsych button rendered below is disabled until
    // the participant has actually tried the hold button. Passive reading
    // would defeat the pedagogical point of the interactive demo
    // (Mayer 2005 — learning-by-doing vs learning-by-reading).
    const continueBtn = document.querySelector('#jspsych-html-button-response-btngroup .jspsych-btn');
    if (continueBtn) {
      continueBtn.disabled = true;
      continueBtn.style.opacity = '0.45';
      continueBtn.style.cursor = 'not-allowed';
      continueBtn.style.filter = 'grayscale(.6)';
    }
    let hasTriedHold = false;
    function releaseContinueGate() {
      if (hasTriedHold) return;
      hasTriedHold = true;
      if (continueBtn) {
        continueBtn.disabled = false;
        continueBtn.style.opacity = '';
        continueBtn.style.cursor = 'pointer';
        continueBtn.style.filter = '';
      }
      holdBtn.style.animation = 'none';
      if (hintEl) {
        hintEl.textContent = 'Good — you\'ve seen how the control works. You can now continue.';
        hintEl.style.color = '#15803d';
      }
    }

    let dartPos = 0.15;
    let held = false;
    let lastT = null;
    let rafId = null;
    const DART_SPEED = 0.22; // fraction of track per second — gentle pace for pedagogy
    const MAX_POS = 0.94;

    function render() {
      povEl.innerHTML = povSceneSvg({
        zoneState: 'neutral',
        ruleText: null,
        buttonHeld: held,
        dartPosition: dartPos
      });
    }

    function tick(t) {
      if (lastT == null) lastT = t;
      const dt = (t - lastT) / 1000;
      lastT = t;
      if (held) {
        dartPos = Math.min(MAX_POS, dartPos + dt * DART_SPEED);
        render();
        if (dartPos >= MAX_POS) {
          held = false;
          holdBtn.textContent = 'Reached the dartboard — reset to try again';
          holdBtn.style.background = '#94a3b8';
        }
      }
      if (held) {
        rafId = requestAnimationFrame(tick);
      } else {
        rafId = null;
      }
    }

    function startHold(e) {
      if (e) e.preventDefault();
      // Release the Continue-gate on the very first press rather than on
      // release. Two reasons: (a) it is more forgiving (a participant who
      // taps once and lets go immediately should not be re-prompted); (b)
      // it makes the gate robust to headless-browser mouse.down/mouse.up
      // sequencing, which in some environments fails to fire mouseup on a
      // positioned-and-animated button. The pedagogical point is that the
      // participant has tried the control at all, not how long they held it.
      releaseContinueGate();
      if (dartPos >= MAX_POS) return;
      held = true; lastT = null;
      holdBtn.style.background = '#1d4ed8';
      if (!rafId) rafId = requestAnimationFrame(tick);
    }
    function stopHold(e) {
      if (e) e.preventDefault();
      if (!held) return;
      held = false;
      holdBtn.style.background = dartPos >= MAX_POS ? '#94a3b8' : '#2563eb';
      render();
      releaseContinueGate();
    }

    holdBtn.addEventListener('mousedown',  startHold);
    holdBtn.addEventListener('mouseup',    stopHold);
    holdBtn.addEventListener('mouseleave', stopHold);
    holdBtn.addEventListener('touchstart', startHold, { passive: false });
    holdBtn.addEventListener('touchend',   stopHold,  { passive: false });
    holdBtn.addEventListener('touchcancel', stopHold, { passive: false });
    // Belt-and-braces: also release the gate on a plain click. Some
    // automation environments (including headless Playwright's
    // mouse.down/mouse.up on animated elements) do not reliably deliver
    // the mouseup to the button; a click handler ensures the gate
    // releases in any interaction path.
    holdBtn.addEventListener('click',      releaseContinueGate);
    holdBtn.addEventListener('pointerdown', releaseContinueGate);

    resetBtn.addEventListener('click', function() {
      dartPos = 0.15;
      held = false;
      holdBtn.textContent = 'Hold to advance';
      holdBtn.style.background = '#2563eb';
      render();
    });

    render();
  }
});

// -------- Demo 1: waiting too long → overinflation pop --------
// Plain (uncoloured) zone; no rule marker, no condition-specific content.
// Balloon-alone scene: the balloon stays at the start, inflates smoothly,
// and pops. The caption says only that the balloon will pop at an unknown
// maximum size (27/09/2026: it used to imply a rising probability, which the
// fixed 12 s deadline never had), without telegraphing the exact deadline. No dart in this illustration —
// overinflation is a balloon-alone mechanic.
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: '<div id="bz-root"><div id="bz-demo1" class="bz-panel"></div></div>',
  choices: [],
  on_load: function() {
    const demoEl = document.getElementById('bz-demo1');
    let timers = [];
    let rafId = null;

    demoEl.innerHTML = `
      <h2 style="text-align:center;">Illustration 1 of 2 — if you wait too long</h2>
      <div id="demo1-cap" class="bz-demo-caption"></div>
      <div style="display:flex; justify-content:center;">
        ${demoScene({
          balloonId: 'demo1-balloon',
          stripId: 'demo1-strip',
          balloonLeft: DEMO_START_X,
          balloonPopped: false,
          zoneClass: '',
          ruleText: ''
        })}
      </div>
      <div id="demo1-controls" class="bz-demo-controls"></div>`;

    const capEl = document.getElementById('demo1-cap');
    const ctrlEl = document.getElementById('demo1-controls');
    const balloonEl = document.getElementById('demo1-balloon');
    setBalloonSize(balloonEl, BALLOON_BASE_PX);

    function clearTimers() {
      timers.forEach(clearTimeout); timers = [];
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    function reset() {
      clearTimers();
      balloonEl.classList.remove('bz-pop');
      balloonEl.style.transition = 'none';
      balloonEl.style.left = DEMO_START_X + 'px';
      setBalloonSize(balloonEl, BALLOON_BASE_PX);
      void balloonEl.offsetWidth;
      capEl.innerHTML = '<strong>Your balloon can pop on its own.</strong> It keeps inflating throughout the trial, and you don\'t know when it will reach its maximum size and pop. If it pops before you act, you get 0 tokens (no bonus). This illustration shows the balloon staying at the start and inflating until it pops.';
      ctrlEl.innerHTML = '<button id="demo1-play" class="bz-btn bz-btn-primary">Play illustration</button>';
      document.getElementById('demo1-play').addEventListener('click', play);
    }

    function play() {
      ctrlEl.innerHTML = '';
      // Smooth rAF inflation, matching the shape of the live-task growth
      // but deliberately shorter than SELF_POP_SEC so the exact deadline
      // is not telegraphed.
      const DEMO_DUR = 3.5;
      const t0 = performance.now();
      function tick() {
        const sec = (performance.now() - t0) / 1000;
        const f = Math.min(1, sec / DEMO_DUR);
        setBalloonSize(balloonEl, BALLOON_BASE_PX + f * (BALLOON_MAX_PX - BALLOON_BASE_PX));
        if (f < 1) {
          rafId = requestAnimationFrame(tick);
        } else {
          rafId = null;
          popBalloon(balloonEl);
          capEl.innerHTML = '<span style="color:#b91c1c; font-weight:600;">Balloon popped from overinflation.</span> 0 tokens.';
          ctrlEl.innerHTML =
            '<button id="demo1-replay" class="bz-btn bz-btn-ghost">Replay</button>' +
            '<button id="demo1-next" class="bz-btn bz-btn-primary">Continue</button>';
          document.getElementById('demo1-replay').addEventListener('click', reset);
          document.getElementById('demo1-next').addEventListener('click', function() {
            clearTimers();
            jsPsych.finishTrial({ demo_phase: 'overinflation' });
          });
        }
      }
      rafId = requestAnimationFrame(tick);
    }

    reset();
  },
  data: { phase: 'demo_overinflation' }
});

// 9. THE GAME (live task)
// =========================================================
// The live task does not render a dart and does not compute any compliance
// outcome. The zone marker is set once per condition (control plain / signal
// red / rule red+Wait / rule_fine red+Wait+−5) and never cycles — the
// partner's instruction is about a static zone, not a cycling light. The
// balloon auto-inflates; overinflation pops it at SELF_POP_SEC. Cross click
// plays a deterministic crossing animation; a successful cross always pays
// CROSSING_PAYOFF. Safe-exit pays SAFE_EXIT_PAYOFF. The threat of the dart
// hitting the balloon is entirely belief-based, seeded in the briefing, and
// is never instantiated in this trial's mechanics. What we measure is how
// long the participant is willing to wait under that believed threat before
// committing to cross (or electing to safe-exit or self-pop).
let gameData = {};

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: '<div id="bz-root"><div id="bz-game" class="bz-panel"></div></div>',
  choices: [],
  on_load: function() {
    const gameEl = document.getElementById('bz-game');

    let done = false, crossing = false, safeExitTaken = false;
    let crossStartSec = -1;
    const t0 = performance.now();

    gameEl.innerHTML = `
      <div class="bz-header">
        <div>Balloon size
          <span class="bz-size-wrap"><span id="bz-size-bar" class="bz-size-bar"></span></span>
        </div>
      </div>
      ${cfg.ruleSummaryShort ? '<div class="bz-rule-area-short">' + cfg.ruleSummaryShort + '</div>' : '<div class="bz-rule-area">&nbsp;</div>'}
      <div class="bz-scene">
        <div class="bz-road-v"></div>
        <div class="bz-zone-start"></div>
        <div class="bz-zone-cross"></div>
        <div id="bz-road-strip" class="bz-road-strip">

        </div>
        <div class="bz-zone-goal"></div>
        <div class="bz-dartboard">${dartboardSvg(42)}</div>
        <div class="bz-top-strip">
          <div class="bz-strip-cell start">Your Start</div>
          <div class="bz-strip-cell cross">Crossing Zone</div>
          <div class="bz-strip-cell goal">Your Goal</div>
        </div>
        <div id="bz-balloon" class="bz-balloon" style="left:${START_CENTER_X}px; top:${ZONE_CENTER_Y}px;"></div>
      </div>
      <div class="bz-controls">
        <button id="bz-cross" class="bz-btn bz-btn-cross">Cross (${tokensToGBP(CROSSING_PAYOFF)} bonus if you reach Goal)</button>

      </div>
      <div class="bz-pay-strip">Reach Goal: <strong>${tokensToGBP(CROSSING_PAYOFF)}</strong> bonus &nbsp;·&nbsp; Safe exit: <strong>${tokensToGBP(SAFE_EXIT_PAYOFF)}</strong> bonus &nbsp;·&nbsp; Balloon pops: <strong>${tokensToGBP(SELF_POP_PAYOFF)}</strong> bonus</div>
      <div id="bz-status" class="bz-status">&nbsp;</div>
    `;

    const sizeBar   = document.getElementById('bz-size-bar');
    const stripEl   = document.getElementById('bz-road-strip');
    const stripText = document.getElementById('bz-road-strip-text');
    const balloonEl = document.getElementById('bz-balloon');
    const crossBtn  = document.getElementById('bz-cross');
    const exitBtn   = document.getElementById('bz-exit');
    const statusEl  = document.getElementById('bz-status');

    setBalloonSize(balloonEl, BALLOON_BASE_PX);

    // Static zone marker per condition — set once, never cycles.
    if (cfg.hasSignal) {
      stripEl.classList.add('is-red');
      if (cfg.hasRule) {
        stripText.textContent = cfg.hasFine ? 'Wait  −5' : 'Wait';
      } else {
        stripText.textContent = '';
      }
    } else {
      stripText.textContent = '';
    }

    function currentSec() { return (performance.now() - t0) / 1000; }
    function balloonSizeAt(sec) {
      const f = Math.min(1, sec / SELF_POP_SEC);
      return BALLOON_BASE_PX + f * (BALLOON_MAX_PX - BALLOON_BASE_PX);
    }

    let rafId = null;
    function tick() {
      if (done) return;
      const sec = currentSec();

      if (sec >= SELF_POP_SEC && !safeExitTaken && !crossing) {
        popBalloon(balloonEl);
        endGame('self_pop', SELF_POP_PAYOFF);
        return;
      }

      const size = balloonSizeAt(sec);
      const pct  = ((size - BALLOON_BASE_PX) / (BALLOON_MAX_PX - BALLOON_BASE_PX)) * 100;
      sizeBar.style.width = Math.min(100, pct) + '%';
      setBalloonSize(balloonEl, size);

      // Graded colour shift: neutral until (1 - WARNING_WINDOW_FRAC) of the
      // deadline, then linear interpolation toward amber and finally red at
      // max. Keeps the deadline implicit (no number) while reducing
      // accidental self-pops. Traffic-light palette per Wickens & Hollands
      // (2000) graded-urgency guidance.
      const warnStart = SELF_POP_SEC * (1 - WARNING_WINDOW_FRAC);
      if (sec >= warnStart) {
        const wf = Math.min(1, (sec - warnStart) / (SELF_POP_SEC - warnStart));
        // amber (#f59e0b) at wf=0.5, red (#dc2626) at wf=1
        const r = Math.round(245 + (220 - 245) * wf);
        const g = Math.round(158 + (38  - 158) * wf);
        const b = Math.round(11  + (38  - 11 ) * wf);
        sizeBar.style.background = 'rgb(' + r + ',' + g + ',' + b + ')';
      } else {
        sizeBar.style.background = '';
      }

      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);

    crossBtn.addEventListener('click', function() {
      if (done || crossing) return;
      crossing = true;
      crossStartSec = currentSec();

      crossBtn.disabled = true; exitBtn.disabled = true;
      crossBtn.textContent = 'Committed — crossing';
      statusEl.innerHTML = '<strong>Crossing the zone.</strong> Once started, the crossing cannot be stopped or reversed.';

      balloonEl.style.transition = 'left ' + CROSSING_DURATION + 's ease-in-out, width .2s linear, height .2s linear';
      requestAnimationFrame(function() { balloonEl.style.left = GOAL_CENTER_X + 'px'; });

      // No dart is computed in this task. A cross always completes
      // successfully. The participant's decision-time to commit is the
      // primary behavioural signal; the outcome is deterministic by design.
      setTimeout(function() {
        if (done) return;
        endGame('safe', CROSSING_PAYOFF);
      }, CROSSING_DURATION * 1000);
    });

    exitBtn.addEventListener('click', function() {
      if (done || crossing) return;
      safeExitTaken = true;
      endGame('safe_exit', SAFE_EXIT_PAYOFF);
    });

    function endGame(outcome, payout) {
      if (done) return;
      done = true;
      cancelAnimationFrame(rafId);
      window.S3_OUTCOME = outcome;

      const tEnd = currentSec();
      gameData = {
        condition: assignedCondition,
        condition_label: cfg.label,
        outcome: outcome,
        crossed: outcome === 'safe',
        safe_exit: outcome === 'safe_exit',
        self_popped: outcome === 'self_pop',
        cross_start_sec: crossStartSec,
        trial_end_sec: tEnd,
        balloon_size_at_cross_px: crossStartSec >= 0 ? Math.round(balloonSizeAt(crossStartSec)) : null,
        final_payout: payout,
        bonus_gbp: +(payout * TOKEN_VALUE_GBP).toFixed(2),
        self_pop_deadline_sec: SELF_POP_SEC,
        crossing_duration_sec: CROSSING_DURATION
      };

      setTimeout(function() { showResult(outcome, payout); }, 1400);
    }

    function showResult(outcome, payout) {

        cls = 'bz-outcome-safe';
